<style>
/* سند — التصميم
   الأخضر: هوية سند والإجراءات الأساسية (مأخوذ من الشعار)
   الذهبي: «جسر اللغة» فقط، أي ما قاله الحاج بلغته
   الأحمر والبرتقالي: مستويات الخطر والعاجل فقط */

:root {
  color-scheme: light;
  --bg: #F1F3F0;
  --surface: #FFFFFF;
  --surface-2: #F6F8F6;
  --ink: #15302A;
  --ink-2: #566A63;
  --line: #DCE3DF;
  --green: #1F4D41;
  --green-2: #3E6D5E;
  --green-ink: #FFFFFF;
  --green-soft: #E2EEE9;
  --gold: #9C7A3C;
  --gold-soft: #F5EEDF;
  --high: #B42318;
  --high-soft: #FDE8E5;
  --med: #B45309;
  --med-soft: #FDF0DD;
  --low: #2F7D5B;
  --low-soft: #E3F2EA;
  --focus: #1A73E8;
  --font: 'Readex Pro', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0E1715;
    --surface: #16221F;
    --surface-2: #1C2B27;
    --ink: #E4EDE9;
    --ink-2: #9FB2AB;
    --line: #2A3B36;
    --green: #6CC4A8;
    --green-2: #8FD3BD;
    --green-ink: #06201A;
    --green-soft: #1C3830;
    --gold: #DDB86A;
    --gold-soft: #2D2617;
    --high: #FF8A7E;
    --high-soft: #3B1E1B;
    --med: #F5B064;
    --med-soft: #3A2A16;
    --low: #7DD3A8;
    --low-soft: #183327;
    --focus: #8AB4F8;
  }
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; direction: ltr; unicode-bidi: isolate; }
.ic { inline-size: 1.2em; block-size: 1.2em; flex: none; }
.ic-xl { inline-size: 2.4rem; block-size: 2.4rem; }
bdi { unicode-bidi: isolate; }
:lang(ur) { font-family: 'Noto Nastaliq Urdu', var(--font); line-height: 2.2; }
time { color: var(--ink-2); font-size: 0.8125rem; white-space: nowrap; }

/* ---------- الهيكل ---------- */
#app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-block-size: 100vh; }
.side {
  position: sticky; inset-block-start: 0; block-size: 100vh; overflow-y: auto;
  background: var(--surface); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px; padding: 24px 18px;
}
.brand { display: flex; align-items: center; gap: 12px; padding-inline: 4px; }
.brand img { inline-size: 58px; block-size: auto; }
.brand strong { display: block; font-size: 1.6rem; line-height: 1.1; color: var(--green); font-weight: 700; }
.brand span { display: block; font-size: 0.75rem; color: var(--ink-2); line-height: 1.4; }
@media (prefers-color-scheme: dark) { .brand img { background: #F4F3EF; border-radius: 12px; padding: 4px; } }

.role-switch { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.role-switch button { padding: 8px 6px; border-radius: 9px; font-size: 0.8125rem; font-weight: 500; text-align: center; color: var(--ink-2); }
.role-switch [aria-pressed="true"] { background: var(--green); color: var(--green-ink); }

.role-label { padding: 10px 14px; border-radius: 12px; background: var(--green); color: var(--green-ink); font-weight: 600; font-size: 0.9375rem; text-align: center; }
.camp-pick { display: grid; gap: 4px; font-size: 0.8125rem; color: var(--ink-2); }
select, input[type="search"] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; min-block-size: 42px;
}

.nav { display: grid; gap: 2px; }

.main { padding: 36px 44px 64px; max-inline-size: 1240px; inline-size: 100%; outline: none; display: grid; gap: 22px; align-content: start; }

/* الأزرار */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-block-size: 42px; padding: 8px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9375rem; border: 1.5px solid transparent; white-space: nowrap; }

/* الخطر */
.risk { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }

/* ---------- نظرة عامة ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.attention { border-color: color-mix(in srgb, var(--high) 35%, var(--line)); }

.stack { display: flex; block-size: 16px; border-radius: 999px; overflow: hidden; gap: 3px; }

.bars { display: grid; gap: 4px; }

.sites { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

/* ---------- السجل ---------- */
.searchbar { display: flex; gap: 12px; }
.search { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding-inline: 14px; color: var(--ink-2); }

.search input { flex: 1; border: 0; background: transparent; min-block-size: 52px; font-size: 1.0625rem; color: var(--ink); outline: none; padding: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.filter { display: grid; gap: 4px; font-size: 0.8125rem; color: var(--ink-2); }
.filter select { min-inline-size: 150px; color: var(--ink); }
.count { color: var(--ink-2); font-size: 0.875rem; }
.table-wrap { overflow-x: auto; }
.table { inline-size: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.table th, .table td { text-align: start; padding: 14px 18px; border-block-end: 1px solid var(--line); vertical-align: middle; }

.table tbody th small { display: block; font-weight: 400; color: var(--ink-2); font-size: 0.8125rem; }
.needs-cell { color: var(--ink-2); font-size: 0.875rem; min-inline-size: 12rem; }

/* ---------- الخريطة ---------- */
.layers { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.875rem; color: var(--ink-2); }
.chip-btn b { color: var(--ink); font-weight: 600; }
.chip-btn[aria-pressed="true"] { border-color: var(--green); color: var(--ink); background: var(--green-soft); }

.sv-mini { inline-size: 12px; block-size: 12px; border-radius: 4px; }
.dot-key { inline-size: 10px; block-size: 10px; border-radius: 50%; background: var(--high); box-shadow: 4px 0 0 var(--med), 8px 0 0 var(--low); margin-inline-end: 8px; }

.t-health { --t: #C0392B; }
.t-ambulance { --t: #8E1B12; }
.t-volunteer { --t: #9C7A3C; }
.t-wheelchair { --t: #1F4D41; }
.t-toilet { --t: #3F6A8A; }
.t-rest { --t: #2E8A82; }

.sv { display: grid; place-items: center; inline-size: 36px; block-size: 36px; border-radius: 10px; background: var(--t); color: #fff; flex: none; }

.map-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }

.map { display: block; inline-size: 100%; block-size: auto; background: var(--surface-2); }

.map .pin { cursor: pointer; }

.map .dot.r-high { fill: var(--high); }

.map .dot.r-low { fill: var(--low); }

.map-note { font-size: 0.75rem; color: var(--ink-2); padding: 10px 16px; border-block-start: 1px solid var(--line); }

.map-panel { position: sticky; inset-block-start: 20px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-block-end: 14px; }
.panel-head h2 { font-size: 1.0625rem; font-weight: 600; line-height: 1.4; }
.panel-head p { font-size: 0.875rem; color: var(--ink-2); }

.facts { display: grid; gap: 10px; }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding-block-end: 10px; border-block-end: 1px solid var(--line); }

.facts .ok { color: var(--low); }
.facts .warn { color: var(--med); }

.nearest { display: grid; gap: 10px; }
.nearest li { display: flex; align-items: center; gap: 12px; }
.nearest li > div { flex: 1; min-inline-size: 0; }
.nearest strong { display: block; font-size: 0.9375rem; font-weight: 600; }
.nearest span { font-size: 0.8125rem; color: var(--ink-2); }

/* ---------- التواصل الوارد ---------- */
.call-group h2 { font-size: 1.125rem; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-block-end: 12px; }
.count-pill { font-size: 0.8125rem; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-weight: 500; }
.calls { display: grid; gap: 10px; }
.call { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px; border-inline-start: 4px solid var(--line); }

.lang-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--gold); background: var(--gold-soft); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }

/* ---------- غرفة الحالة ---------- */
.case { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }

.case-map-head { padding: 18px 22px 12px; }
.case-map-head h2 { font-size: 1.125rem; font-weight: 600; }
.case-map-head p { font-size: 0.875rem; }

.case-actions { display: grid; gap: 14px; }
.action h2 { display: flex; align-items: center; gap: 10px; font-size: 1.0625rem; font-weight: 600; margin-block-end: 14px; color: var(--green); }

.radio { position: relative; }

.status-done { padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }

.log { display: grid; gap: 0; }
.log li { display: grid; grid-template-columns: 6rem 1fr; gap: 12px; padding-block: 10px; border-block-start: 1px solid var(--line); font-size: 0.9375rem; }

/* جسر اللغة */
.bridge { background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; border-inline-start: 3px solid var(--gold); display: grid; gap: 4px; }

.bridge-orig { font-size: 1rem; }

.bridge-ar { font-size: 0.9375rem; color: var(--ink-2); padding-block-start: 6px; border-block-start: 1px dashed color-mix(in srgb, var(--gold) 40%, transparent); }
.case-who .bridge { margin-block-end: 4px; }
.action .bridge { margin-block-start: 4px; }

/* ---------- الحملات ---------- */
.camp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

/* ---------- مشرف الحملة ---------- */
.need-sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.need-sum li { padding: 14px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 2px; }
.need-sum strong { font-size: 1.625rem; font-weight: 600; color: var(--green); line-height: 1.1; }

.list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-block-start: 8px; }

.seg-ctrl, .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 12px; inline-size: fit-content; }

.seg-ctrl b, .tabs b { font-weight: 600; }
.seg-ctrl [aria-pressed="true"], .tabs [aria-pressed="true"] { background: var(--green); color: var(--green-ink); }

.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.p-card { inline-size: 100%; display: grid; gap: 10px; align-content: start; padding: 18px 20px; border-inline-start: 4px solid var(--line); transition: border-color 0.15s; }
.p-card:hover { border-color: var(--green); }
.r-edge-high { border-inline-start-color: var(--high) !important; }
.r-edge-medium { border-inline-start-color: var(--med) !important; }
.r-edge-low { border-inline-start-color: var(--low) !important; }
.p-card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.p-card-top strong { display: block; font-size: 1.0625rem; font-weight: 600; }
.p-card-top .mono { font-size: 0.75rem; color: var(--ink-2); }
.p-dev { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--ink-2); }
.p-open { justify-self: start; font-size: 0.8125rem; color: var(--green); background: var(--green-soft); padding: 2px 10px; border-radius: 999px; font-weight: 500; }

.dots { display: grid; gap: 6px; }
.dots li { position: relative; padding-inline-start: 16px; font-size: 0.9375rem; }
.dots li::before { content: ""; position: absolute; inset-inline-start: 2px; inset-block-start: 0.7em; inline-size: 6px; block-size: 6px; border-radius: 50%; background: var(--green-2); }
.p-card .dots li { font-size: 0.875rem; color: var(--ink-2); }

.reqs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); align-items: start; }
.req { display: grid; gap: 12px; border-inline-start: 4px solid var(--line); }
.req.s-new { border-inline-start-color: var(--green); }
.req.s-progress { border-inline-start-color: var(--gold); }

.req-top { display: flex; align-items: center; gap: 12px; }
.req-top h3 { font-size: 1.125rem; font-weight: 600; }
.req-top time { margin-inline-start: auto; }
.state-tag { font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.st-new { background: var(--green-soft); color: var(--green); }
.st-progress { background: var(--gold-soft); color: var(--gold); }
.st-done { background: var(--surface-2); color: var(--ink-2); }
.req-who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.9375rem; }
.req-note { font-size: 0.9375rem; }
.escalated { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--ink-2); }
.req-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block-start: 12px; border-block-start: 1px solid var(--line); }
.req-actions .btn-quiet { margin-inline-start: auto; }
.assign { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--ink-2); }
.assigned { display: flex; align-items: center; gap: 6px; font-size: 0.9375rem; color: var(--green); font-weight: 500; }

.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.res h3 { font-size: 1rem; font-weight: 600; }
.res-num { margin-block: 8px 10px; color: var(--ink-2); }
.res-num strong { font-size: 2rem; font-weight: 600; color: var(--ink); margin-inline-end: 4px; }
.res .muted { font-size: 0.8125rem; margin-block-start: 8px; }
.res .warn { color: var(--high); font-weight: 600; }
.meter { display: flex; block-size: 8px; border-radius: 999px; background: var(--green-soft); overflow: hidden; }
.meter span { background: var(--green); border-radius: 999px; }

.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mate h3 { font-size: 1rem; font-weight: 600; }
.mate > .muted { font-size: 0.8125rem; margin-block: 2px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.name-chip { font-size: 0.8125rem; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.name-chip:hover { border-color: var(--green); color: var(--green); }

.days { display: grid; gap: 14px; }
.day { display: grid; grid-template-columns: 220px 1fr; gap: 24px; }
.day-head { display: flex; gap: 14px; align-items: flex-start; }
.day-date { flex: none; inline-size: 64px; padding: 8px 4px; border-radius: 10px; background: var(--green); color: var(--green-ink); font-size: 0.8125rem; font-weight: 600; text-align: center; line-height: 1.3; }
.day-head h3 { font-size: 1.0625rem; font-weight: 600; }
.day-head p { font-size: 0.875rem; }
.day-rules { display: grid; gap: 12px; }
.day-rules div { display: grid; grid-template-columns: 13rem 1fr; gap: 12px; align-items: start; }
.day-rules dt { font-size: 0.9375rem; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; padding-block-start: 3px; }
.day-rules dt b { color: var(--green); }

/* ---------- ملف الحاج ---------- */
.profile-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.ph-main { flex: 1; }
.profile-head h1 { font-size: 1.875rem; font-weight: 600; line-height: 1.3; }
.facts.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-block-start: 18px; border: 1px solid var(--line); border-radius: 12px; }
.facts.row div { display: block; padding: 12px 14px; border: 0; border-inline-start: 1px solid var(--line); }
.facts.row div:first-child { border-inline-start: 0; }
.facts.row dd { text-align: start; margin-block-start: 2px; }
.idcard { flex: none; inline-size: 210px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: #15302A; text-align: center; }
.barcode { display: block; inline-size: 100%; block-size: 56px; fill: #15302A; }
.idcard .mono { margin-block-start: 8px; font-weight: 600; }

.profile { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.risk-card { border-width: 1.5px; }
.r-bg-high { border-color: color-mix(in srgb, var(--high) 45%, var(--line)); }
.r-bg-medium { border-color: color-mix(in srgb, var(--med) 45%, var(--line)); }
.r-bg-low { border-color: color-mix(in srgb, var(--low) 45%, var(--line)); }
.risk-big { display: flex; align-items: baseline; gap: 12px; }
.risk-big strong { font-size: 2.5rem; font-weight: 700; line-height: 1.1; }
.r-bg-high .risk-big strong { color: var(--high); }
.r-bg-medium .risk-big strong { color: var(--med); }
.r-bg-low .risk-big strong { color: var(--low); }
.risk-big span { color: var(--ink-2); }
.risk-scale { display: flex; block-size: 8px; border-radius: 999px; margin-block-start: 12px; background: linear-gradient(to left, var(--low-soft) 0 30%, var(--med-soft) 30% 55%, var(--high-soft) 55%); overflow: hidden; }
.risk-scale span { background: var(--ink); opacity: 0.75; border-radius: 999px; }

.func { display: grid; gap: 4px; }
.func li { display: grid; grid-template-columns: minmax(0, 1fr) auto 8.5rem; gap: 14px; align-items: center; padding-block: 9px; border-block-end: 1px solid var(--line); font-size: 0.9375rem; }
.func li:last-child { border: 0; }
.f-scale { display: flex; gap: 3px; }
.f-scale i { inline-size: 18px; block-size: 8px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.f-scale i.on.l0 { background: var(--low); border-color: var(--low); }
.f-scale i.on.l1 { background: var(--green-2); border-color: var(--green-2); }
.f-scale i.on.l2 { background: var(--med); border-color: var(--med); }
.f-scale i.on.l3 { background: var(--high); border-color: var(--high); }
.f-level { font-size: 0.8125rem; color: var(--ink-2); }
.f-level.l3 { color: var(--high); font-weight: 600; }
.f-level.l2 { color: var(--med); font-weight: 500; }
.need-groups { display: grid; gap: 4px; }
.need-groups .mini:first-child { margin-block-start: 0; }
.mini-reqs li { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-block-end: 1px solid var(--line); }
.mini-reqs li:last-child { border: 0; }
.mini-reqs time { margin-inline-start: auto; }

/* ---------- التنبيه ---------- */
#toast { position: fixed; inset-block-end: 24px; inset-inline-start: 50%; transform: translate(50%, 150%); visibility: hidden; background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 12px; font-weight: 500; z-index: 50; transition: transform 0.25s, visibility 0.25s; max-inline-size: calc(100vw - 32px); }
#toast.show { transform: translate(50%, 0); visibility: visible; }

/* ---------- الشاشات الأصغر ---------- */
@media (max-width: 1180px) {
  .case-actions { grid-template-columns: 1fr 1fr; }
  .map-layout { grid-template-columns: 1fr; }
  .map-panel { position: static; }
}
@media (max-width: 960px) {
  #app { grid-template-columns: 1fr; }
  .side { position: static; block-size: auto; z-index: 10; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-inline-end: 0; border-block-end: 1px solid var(--line); }
  .brand img { inline-size: 40px; }
  .brand strong { font-size: 1.3rem; }
  .brand span { display: none; }
  .role-switch, .role-label { margin-inline-start: auto; }
  .camp-pick { flex-direction: row; display: flex; align-items: center; gap: 8px; }
  .nav { order: 5; inline-size: 100%; display: flex; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .nav button { flex: none; padding: 8px 12px; font-size: 0.875rem; }
  .today { display: none; }
  .main { padding: 24px 18px 56px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .grid-2, .profile { grid-template-columns: 1fr; }
  .sites { grid-template-columns: 1fr 1fr; }
  .need-sum { grid-template-columns: repeat(3, 1fr); }
  .case { grid-template-columns: 1fr; }
  .case-actions { grid-template-columns: 1fr; }
  .day { grid-template-columns: 1fr; gap: 14px; }
  .facts.row { grid-template-columns: 1fr 1fr; }
  .facts.row div:nth-child(3) { border-inline-start: 0; }
  .facts.row div:nth-child(n+3) { border-block-start: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .page-head h1, .profile-head h1 { font-size: 1.5rem; }
  .role-switch, .role-label { inline-size: 100%; margin: 0; order: 3; }
  .camp-pick { order: 4; inline-size: 100%; }
  .camp-pick select { flex: 1; }
  .card { padding: 18px; }
  .stat strong { font-size: 1.875rem; }
  .legend { grid-template-columns: 1fr; }
  .bars button { grid-template-columns: 7rem 1fr 1.5rem; }
  .searchbar { flex-direction: column; }
  .filter { flex: 1 1 45%; }
  .filter select { min-inline-size: 0; inline-size: 100%; }
  .call { grid-template-columns: 1fr auto; }
  .call-main { grid-column: 1 / -1; }
  .call .btn { grid-column: 1 / -1; }
  .need-sum { grid-template-columns: 1fr 1fr; }
  .res-grid { grid-template-columns: 1fr; }
  .profile-head { flex-direction: column; }
  .idcard { inline-size: 100%; }
  .func li { grid-template-columns: 1fr auto; }
  .f-level { grid-column: 1 / -1; margin-block-start: -6px; }
  .day-rules div { grid-template-columns: 1fr; gap: 6px; }
  .att-list li { grid-template-columns: auto 1fr; }
  .att-list .btn { grid-column: 1 / -1; }
  .req-actions .btn-quiet { margin-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>

/* ---------- توليد الحجاج (ثابت في كل تحميل) ---------- */
function makeRng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildPilgrims() {
  const rnd = makeRng(1447);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const range = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const deviceCycle = ['wheelchair', 'cane', 'wheelchair', 'walker', 'none', 'cane', 'wheelchair', 'none'];

  return PEOPLE.map(([name, gender, lang, nat], i) => {
    const device = deviceCycle[i % deviceCycle.length];
    const campaign = CAMPAIGNS[i % CAMPAIGNS.length].id;
    const age = range(58, 86);
    const f = {};
    if (device === 'wheelchair') Object.assign(f, { walk: 3, stand: range(2, 3), slope: 3, transfer: range(1, 2), crowd: range(2, 3), selfcare: range(1, 2) });
    else if (device === 'walker') Object.assign(f, { walk: range(2, 3), stand: 2, slope: range(2, 3), transfer: range(0, 1), crowd: 2, selfcare: range(0, 1) });
    else if (device === 'cane') Object.assign(f, { walk: 2, stand: range(1, 2), slope: 2, transfer: range(0, 1), crowd: range(1, 2), selfcare: range(0, 1) });
    else Object.assign(f, { walk: range(1, 2), stand: 1, slope: range(1, 2), transfer: 0, crowd: range(0, 1), selfcare: 0 });

    const maxWalk = device === 'wheelchair' ? range(0, 2) * 10 : device === 'walker' ? range(5, 15) * 10 : device === 'cane' ? range(10, 30) * 10 : range(25, 60) * 10;
    const falls = rnd() < 0.45 ? range(1, 3) : 0;
    const conds = [];
    const nCond = range(0, 2);
    while (conds.length < nCond) { const c = pick(CONDITIONS); if (!conds.includes(c)) conds.push(c); }
    const vision = conds.includes('ضعف النظر') || rnd() < 0.2;
    const meds = rnd() < 0.35;
    const heat = conds.includes('السكري') || conds.includes('أمراض القلب') || age >= 78;

    const g = (m, w) => gender === 'f' ? w : m;
    const factors = [];
    let score = 0;
    if (falls) { score += falls > 1 ? 30 : 20; factors.push(falls > 1 ? `${g('سقط', 'سقطت')} ${falls === 2 ? 'مرتين' : falls + ' مرات'} خلال السنة الماضية` : `${g('سقط', 'سقطت')} مرة خلال السنة الماضية`); }
    if (f.crowd >= 2) { score += 15; factors.push('ضعف التوازن وسط الزحام'); }
    if (device === 'cane' || device === 'walker') { score += 15; factors.push(`${g('يعتمد', 'تعتمد')} على ${DEVICES[device]} في المشي`); }
    if (device === 'wheelchair') { score += 10; factors.push('خطر السقوط أثناء الانتقال من الكرسي وإليه'); }
    if (vision) { score += 10; factors.push('ضعف في النظر أو نوبات دوار'); }
    if (meds) { score += 10; factors.push(`${g('يتناول', 'تتناول')} أدوية قد تسبب الدوار أو النعاس`); }
    if (age >= 75) { score += 10; factors.push('العمر 75 سنة أو أكثر'); }
    if (maxWalk < 200 && device !== 'wheelchair') { score += 5; factors.push('قدرة تحمل منخفضة في المشي'); }
    score = Math.min(100, score);
    const risk = score >= 55 ? 'high' : score >= 30 ? 'medium' : 'low';

    const needs = [];
    if (device === 'wheelchair') needs.push({ cat: 'devices', text: rnd() < 0.5 ? 'كرسي متحرك (يملك كرسيه)' : 'توفير كرسي متحرك من الحملة' });
    if (device === 'cane') needs.push({ cat: 'devices', text: 'عصا مشي' });
    if (device === 'walker') needs.push({ cat: 'devices', text: 'مشاية' });
    if (risk === 'high' || f.selfcare >= 2) needs.push({ cat: 'escort', text: 'مرافق دائم' });
    else if (f.crowd >= 2) needs.push({ cat: 'escort', text: 'مرافق في أماكن الزحام' });
    if (f.walk >= 2) needs.push({ cat: 'mobility', text: 'مركبة مهيأة للتنقل بين المشاعر' });
    if (f.walk >= 2) needs.push({ cat: 'rituals', text: 'الطواف والسعي بالعربة' });
    if (f.walk >= 3 || (risk === 'high' && f.crowd >= 2)) needs.push({ cat: 'rituals', text: 'التوكيل في رمي الجمرات' });
    else if (f.crowd >= 1) needs.push({ cat: 'rituals', text: 'مرافق عند رمي الجمرات' });
    if (conds.includes('السكري')) needs.push({ cat: 'health', text: 'متابعة السكر ومواعيد الدواء' });
    if (heat) needs.push({ cat: 'health', text: 'استراحات مظللة متقاربة لتجنب الإجهاد الحراري' });
    if (f.selfcare >= 1) needs.push({ cat: 'health', text: 'دورة مياه مهيأة قريبة من مكان الإقامة' });

    const diffs = [];
    if (device === 'wheelchair') diffs.push(g('لا يمشي، ويتنقل بالكرسي المتحرك', 'لا تمشي، وتتنقل بالكرسي المتحرك'));
    else diffs.push(`أقصى مسافة مشي دون توقف: ${maxWalk} م تقريباً`);
    if (f.stand >= 2) diffs.push(g('لا يتحمل', 'لا تتحمل') + ' الوقوف أكثر من 10 دقائق');
    if (f.slope >= 2) diffs.push('صعوبة في المنحدرات، مثل جسر الجمرات');
    if (f.transfer >= 1) diffs.push(f.transfer >= 2 ? g('يحتاج شخصاً لمساعدته', 'تحتاج شخصاً لمساعدتها') + ' في الانتقال من الكرسي وإليه' : g('يحتاج', 'تحتاج') + ' إشرافاً عند الانتقال من الكرسي وإليه');
    if (f.crowd >= 2) diffs.push(g('يفقد توازنه', 'تفقد توازنها') + ' بسهولة وسط الزحام');
    if (f.selfcare >= 2) diffs.push(g('يحتاج', 'تحتاج') + ' مساعدة في استخدام دورة المياه');
    if (heat) diffs.push('حساسية عالية للحرارة');

    const site = rnd() < 0.62 ? 'arafat' : rnd() < 0.7 ? 'mina' : 'haram';
    const [bx, by, bw, bh] = SITES[site].box;
    const located = rnd() < 0.82;
    const pos = located ? { x: Math.round(bx + 15 + rnd() * (bw - 30)), y: Math.round(by + 15 + rnd() * (bh - 30)) } : null;
    const companion = needs.some(n => n.cat === 'escort') && rnd() < 0.65 ? pick(gender === 'f' ? ['ابنها', 'ابنتها', 'زوجها', 'أختها'] : ['ابنه', 'ابنته', 'زوجته', 'أخوه']) : null;

    return {
      id: 'SND-' + String(104200 + i * 37 + range(1, 30)),
      name, gender, lang, nat, age, campaign, device, f, maxWalk, falls, conds, meds, vision, heat,
      score, risk, factors, needs, diffs, site, pos, companion,
      updated: range(1, 25),
      tent: CAMPAIGNS.find(c => c.id === campaign).camp
    };
  });
}

  const icon = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

  /* باركود تعريفي مولّد من الرقم (للعرض في النموذج الأولي) */
  function barcode(id) {
    let x = 0, bars = '';
    const digits = id.replace(/\D/g, '') + '7';
    const push = (w, dark) => { if (dark) bars += `<rect x="${x}" y="0" width="${w}" height="34"/>`; x += w; };
    push(2, 1); push(1, 0); push(1, 1); push(1, 0);
    for (const ch of digits) {
      const n = +ch;
      push(1 + (n % 3), 1); push(1 + ((n + 1) % 2), 0); push(1 + ((n + 2) % 3 === 0 ? 2 : 0), 1); push(1 + (n % 2), 0);
    }
    push(1, 1); push(1, 0); push(2, 1);
    return `<svg class="barcode" viewBox="0 0 ${x} 34" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
  }

  /* ================= المشرف العام ================= */

  function gOverview() {

    const siteCount = Object.keys(SITES).map(k => [k, PILGRIMS.filter(p => p.site === k).length]);
    const highNoCompanion = PILGRIMS.filter(p => p.risk === 'high' && !p.companion).length;
    const urgentCalls = waitingCalls().filter(callUrgent);

    return `
    ${pageHead('نظرة عامة', 'جميع الحجاج ذوي محدودية الحركة المسجلين في سند، لحظة بلحظة')}

  function gRegistry() {
    const f = state.reg;
    const q = f.q.trim().toLowerCase();

      (!q || p.id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)) &&
      (!f.risk || p.risk === f.risk) && (!f.camp || p.campaign === f.camp) &&
      (!f.site || p.site === f.site) && (!f.need || p.needs.some(n => n.cat === f.need)))

      <label class="filter"><span>${label}</span>

    return `

  /* ---------- الخريطة ---------- */
  /* إسقاط مائل يقرّب شكل المشاعر من الواقع: الحرم غرباً وعرفات جنوب شرق */
  const T = p => ({ x: p.x, y: Math.round(p.y + (p.x - 60) * 0.32) });

  function mapSvg(o = {}) {
    const fT = o.focus ? T(o.focus) : null;
    const vb = fT ? `${fT.x - 165} ${fT.y - 115} 330 230` : '40 205 930 520';
    const types = o.allTypes ? Object.keys(SERVICE_TYPES) : [...state.layers];
    const regions = `<g transform="matrix(1 0.32 0 1 0 -19.2)">
      <path class="reg" d="M70 270q20-40 70-30t40 60-60 50-60-30 10-50z"/>
      <path class="reg" d="M240 250q60-35 140-25t90 50-60 70-140 0-30-95z"/>
      <path class="reg" d="M515 290q50-30 110-10t15 80-90 25-35-95z"/>
      <path class="reg" d="M710 250q90-55 190-10t10 160-150 30-60-180z"/>
      <path class="road" d="M150 300C200 290 230 292 260 290S420 300 470 305 560 330 600 330 690 318 730 320"/>
      <path class="rail" d="M470 285C540 300 600 300 720 300"/></g>
      ${Object.entries(SITES).map(([k, s]) => {
        const l = T({ x: { haram: 115, mina: 360, muzdalifah: 585, arafat: 815 }[k], y: { haram: 236, mina: 220, muzdalifah: 270, arafat: 222 }[k] });
        return `<text class="reg-label" x="${l.x}" y="${l.y}">${s.ar}</text>`;
      }).join('')}
      ${[['الجمرات', 248, 308], ['جبل الرحمة', 845, 264]].map(([t, x, y]) => { const q = T({ x, y }); return `<text class="poi" x="${q.x}" y="${q.y}">${t}</text>`; }).join('')}`;

    const lines = (o.lines || []).map(l => { const a = T(l.a), b = T(l.b); return `<line class="link-line" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join('');

    const svc = SERVICES.filter(s => types.includes(s.type)).map(s => {
      const on = o.sel === s.id || (o.hi || []).includes(s.id);
      const q = T(s);
      return `<g class="pin t-${s.type}${on ? ' on' : ''}" data-act="map-sel" data-v="s:${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}" transform="translate(${q.x - 9} ${q.y - 9})">
        <rect width="18" height="18" rx="5"/>
        <g transform="translate(2.5 2.5) scale(0.54)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${IC[s.type]}</g>
      </g>`;
    }).join('');

    const pil = (o.pilgrims ? PILGRIMS.filter(p => p.pos) : []).map(p => { const q = T(p.pos); return `
      <circle class="dot r-${p.risk}${o.sel === p.id ? ' on' : ''}" cx="${q.x}" cy="${q.y}" r="${o.sel === p.id ? 6 : 4.2}" data-act="map-sel" data-v="p:${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}"/>`; }).join('');

    const me = fT ? `<g class="me"><circle cx="${fT.x}" cy="${fT.y}" r="13"/><circle cx="${fT.x}" cy="${fT.y}" r="6"/></g>` : '';

    return `<svg class="map" viewBox="${vb}" role="img" aria-label="خريطة تخطيطية للمشاعر المقدسة">${regions}${lines}${pil}${svc}${me}</svg>`;
  }

  function nearestBlock(pos, types = ['health', 'ambulance', 'volunteer', 'toilet']) {
    return `<ul class="nearest">${types.map(t => {
      const n = nearest(pos, t)[0];
      return `<li><span class="sv t-${t}">${icon(t)}</span><div><strong>${esc(n.s.name)}</strong><span>${SERVICE_TYPES[t].ar}${n.s.channel ? `، اللاسلكي: القناة ${n.s.channel}` : ''}</span></div><b>${fmtM(n.d)}</b></li>`;
    }).join('')}</ul>`;
  }

  function gMap() {
    const sel = state.mapSel;
    let panel = '';
    let lines = [], hi = [];
    if (sel && sel.startsWith('s:')) {
      const s = S(sel.slice(2));
      const near = PILGRIMS.filter(p => p.pos && meters(p.pos, s) <= 1500);
      panel = `
        <div class="panel-head"><span class="sv t-${s.type}">${icon(s.type)}</span><div><h2>${esc(s.name)}</h2><p>${SERVICE_TYPES[s.type].ar}، ${SITES[s.site].ar}</p></div></div>
        <dl class="facts">
          <div><dt>الحالة</dt><dd class="${s.status === 'متاح' ? 'ok' : 'warn'}">${s.status}</dd></div>
          <div><dt>ساعات العمل</dt><dd>${s.hours}</dd></div>
          ${s.channel ? `<div><dt>قناة اللاسلكي</dt><dd>القناة ${s.channel}</dd></div>` : ''}
          ${s.staff ? `<div><dt>المتطوعون</dt><dd>${s.staff} متطوعاً</dd></div>` : ''}
          <div><dt>حجاج مسجلون ضمن 1.5 كم</dt><dd>${near.length}</dd></div>
        </dl>`;
    } else if (sel && sel.startsWith('p:')) {
      const p = P(sel.slice(2));
      ['health', 'ambulance', 'volunteer'].forEach(t => { const n = nearest(p.pos, t)[0]; lines.push({ a: p.pos, b: n.s }); hi.push(n.s.id); });
      panel = `
        <div class="panel-head"><div><h2><bdi>${esc(p.name)}</bdi></h2><p class="mono">${p.id}</p></div>${riskTag(p.risk)}</div>
        <p class="muted">${esc(C(p.campaign).name)}، ${SITES[p.site].ar}، آخر تحديث للموقع قبل ${p.updated} د</p>
        <h3 class="mini">الأقرب إليه</h3>
        ${nearestBlock(p.pos)}
        <button class="btn btn-primary wide" data-act="open-pilgrim" data-v="${p.id}">فتح الملف</button>`;
    } else {
      panel = `<div class="panel-empty">${icon('pin', 'ic ic-xl')}<p>اختر خدمة أو حاجاً من الخريطة لعرض التفاصيل وأقرب نقاط المساعدة.</p></div>`;
    }
    const counts = t => SERVICES.filter(s => s.type === t).length;

    return `
    ${pageHead('خريطة الخدمات', 'المراكز الصحية والإسعاف ونقاط المتطوعين والخدمات المهيأة في المشاعر')}
    <div class="layers" role="group" aria-label="طبقات الخريطة">
      ${Object.entries(SERVICE_TYPES).map(([k, v]) => `<button class="chip-btn" data-act="layer" data-v="${k}" aria-pressed="${state.layers.has(k)}"><span class="sv-mini t-${k}"></span>${v.plural}<b>${counts(k)}</b></button>`).join('')}
      <button class="chip-btn" data-act="layer-p" aria-pressed="${state.showPilgrims}"><span class="dot-key"></span>الحجاج المشاركون لموقعهم<b>${PILGRIMS.filter(p => p.pos).length}</b></button>
    </div>
    <div class="map-layout">
      <div class="card flush map-card">${mapSvg({ pilgrims: state.showPilgrims, sel: sel ? sel.slice(2) : null, lines, hi })}
        <p class="map-note">خريطة تخطيطية للنموذج الأولي. في النسخة الفعلية تُربط بخرائط حية ومواقع الأجهزة.</p>
      </div>
      <aside class="card map-panel" aria-live="polite">${panel}</aside>
    </div>`;
  }

  /* ---------- التواصل الوارد ---------- */
  function gCalls() {
    const groups = [['waiting', 'بانتظار الرد'], ['active', 'قيد المتابعة'], ['closed', 'مغلقة']];
    const row = c => {
      const p = P(c.pid), L = p.lang;
      return `
      <li class="call ${callUrgent(c) && c.status !== 'closed' ? 'urgent' : ''}">
        <div class="call-main">
          <p class="call-topic">${callTopic(c, 'ar')}${callUrgent(c) ? '<span class="tag-urgent">عاجل</span>' : ''}</p>
          <p class="muted"><bdi>${esc(p.name)}</bdi>، ${esc(C(p.campaign).name)}${c.escalated ? '، مرفوع من الحملة' : ''}</p>
        </div>
        <span class="lang-chip">${icon('globe')}${LANGS[L].ar}</span>
        ${riskTag(p.risk, false)}
        ${timeTag(c.at)}
        <button class="btn ${c.status === 'waiting' ? 'btn-primary' : 'btn-ghost'}" data-act="open-call" data-v="${c.id}">${c.status === 'waiting' ? 'الرد وفتح الملف' : 'عرض الحالة'}</button>
      </li>`;
    };
    return `
    ${pageHead('التواصل الوارد', 'اتصالات الحجاج من داخل التطبيق والحالات المرفوعة من الحملات')}
    ${groups.map(([k, t]) => {
      const list = state.calls.filter(c => c.status === k).sort((a, b) => callUrgent(b) - callUrgent(a) || a.at - b.at);
      return `<section class="call-group"><h2>${t}<span class="count-pill">${list.length}</span></h2>
        ${list.length ? `<ul class="calls">${list.map(row).join('')}</ul>` : `<p class="empty">${k === 'waiting' ? 'لا توجد اتصالات بانتظار الرد.' : 'لا شيء هنا بعد.'}</p>`}</section>`;
    }).join('')}`;
  }

  function gCase() {
    const c = state.calls.find(x => x.id === state.callId);
    const p = P(c.pid), L = p.lang, dir = LANGS[L].dir;
    const pos = p.pos || { x: SITES[p.site].box[0] + 60, y: SITES[p.site].box[1] + 50 };
    const nh = nearest(pos, 'health')[0], na = nearest(pos, 'ambulance')[0], nv = nearest(pos, 'volunteer')[0];
    const dests = [...nearest(pos, 'health', 2), ...nearest(pos, 'rest', 1), ...nearest(pos, 'toilet', 1), ...nearest(pos, 'volunteer', 1)];
    const destSel = c.dest || dests[0].s.id;
    const dest = dests.find(d => d.s.id === destSel) || dests[0];
    const place = `<bdi lang="ar">${esc(dest.s.name)}</bdi>`;
    const msgL = fill(esc(langText(MSGS.go, L)), { place, d: dest.d });
    const msgA = fill(esc(MSGS.go.ar), { place, d: dest.d });
    const keyDiffs = p.diffs.slice(0, 3);
    const need = p.device === 'wheelchair' ? 'دفع الكرسي المتحرك والمرافقة' : p.risk === 'high' ? 'مرافقة ومساندة أثناء المشي' : 'إرشاد ومرافقة';
    const script = `من مركز سند إلى ${nv.s.name}: حاج من ${C(p.campaign).name}، الرقم ${p.id}، خطر سقوط ${RISK[p.risk]}، ${DEVICES[p.device]}. الموقع: ${SITES[p.site].ar}، على بعد ${fmtM(nv.d)} منكم. البلاغ: ${callTopic(c, 'ar')}. المطلوب: ${need}. لغة الحاج: ${LANGS[L].ar}.`;
    const closed = c.status === 'closed';

    return `
    ${backLink()}
    ${pageHead(`${callTopic(c, 'ar')}`, `<bdi>${esc(p.name)}</bdi>، ${esc(C(p.campaign).name)}، ورد ${ago(c.at)}`,
      closed ? '<span class="status-done">مغلقة</span>' : `<button class="btn btn-ghost" data-act="close-call">إغلاق الحالة</button>`)}

    <div class="case">
      <section class="card case-who">
        <div class="who-top">
          <div><p class="mono">${p.id}</p><h2><bdi>${esc(p.name)}</bdi></h2><p class="muted">${p.age} سنة، ${p.nat}</p></div>
          ${riskTag(p.risk)}
        </div>
        <div class="bridge">
          <p class="bridge-tag">${icon('globe')}ما قاله الحاج باللغة ${LANGS[L].ar}</p>
          <p class="bridge-orig" dir="${dir}" lang="${L}">${callTopic(c, L)}</p>
          ${L !== 'ar' ? `<p class="bridge-ar">${callTopic(c, 'ar')}</p>` : ''}
        </div>
        <h3 class="mini">الحالة الوظيفية</h3>
        <ul class="dots">${keyDiffs.map(d => `<li>${d}</li>`).join('')}</ul>
        <dl class="facts compact">
          <div><dt>الأداة المساعدة</dt><dd>${DEVICES[p.device]}</dd></div>
          <div><dt>المرافق</dt><dd>${p.companion ? p.companion : 'بلا مرافق'}</dd></div>
          ${p.conds.length ? `<div><dt>حالات صحية</dt><dd>${p.conds.join('، ')}</dd></div>` : ''}
        </dl>
        <button class="btn btn-ghost wide" data-act="open-pilgrim" data-v="${p.id}">الملف الكامل</button>
      </section>

      <section class="card case-map flush">
        <div class="case-map-head"><h2>الموقع وأقرب المساعدة</h2>
          <p class="muted">${p.pos ? `${SITES[p.site].ar}، آخر تحديث قبل ${p.updated} د` : 'الحاج لا يشارك موقعه، ويُعرض موقع مخيم حملته التقريبي'}</p></div>
        ${mapSvg({ focus: pos, allTypes: true, lines: [nh, na, nv].map(n => ({ a: pos, b: n.s })), hi: [nh.s.id, na.s.id, nv.s.id] })}
        <div class="case-near">${nearestBlock(pos, ['health', 'ambulance', 'volunteer'])}</div>
      </section>

      <section class="case-actions">
        <div class="card action">
          <h2>${icon('send')}توجيه الحاج</h2>
          <fieldset class="dest">
            <legend class="sr">الوجهة</legend>
            ${dests.map(d => `<label class="radio"><input type="radio" name="dest" value="${d.s.id}" ${d.s.id === dest.s.id ? 'checked' : ''} data-act="dest" ${closed ? 'disabled' : ''}><span>${esc(d.s.name)}<b>${fmtM(d.d)}</b></span></label>`).join('')}
          </fieldset>
          <div class="bridge">
            <p class="bridge-tag">${icon('globe')}تصل للحاج باللغة ${LANGS[L].ar}</p>
            <p class="bridge-orig" dir="${dir}" lang="${L}">${msgL}</p>
            ${L !== 'ar' ? `<p class="bridge-ar">${msgA}</p>` : ''}
          </div>
          <button class="btn btn-primary wide" data-act="send-dir" ${closed ? 'disabled' : ''}>إرسال التوجيه</button>
        </div>

        <div class="card action">
          <h2>${icon('radio')}مساعدة ميدانية عبر اللاسلكي</h2>
          <p class="radio-ch">${esc(nv.s.name)}<span>القناة ${nv.s.channel}</span></p>
          <p class="script">${esc(script)}</p>
          <button class="btn btn-primary wide" data-act="radio" data-v="${nv.s.id}" ${closed ? 'disabled' : ''}>تم البث على القناة ${nv.s.channel}</button>
        </div>

        <div class="card action action-amb">
          <h2>${icon('ambulance')}طلب إسعاف</h2>
          <p class="radio-ch">${esc(na.s.name)}<span>${fmtM(na.d)}، القناة ${na.s.channel}</span></p>
          <button class="btn btn-danger wide" data-act="amb" data-v="${na.s.id}" ${closed ? 'disabled' : ''}>إرسال أقرب إسعاف</button>
        </div>
      </section>
    </div>

    <section class="card">
      <h2>سجل الحالة</h2>
      ${c.log.length ? `<ol class="log">${c.log.map(e => `<li>${timeTag(e.at)}<p>${e.text}</p></li>`).join('')}</ol>` : '<p class="empty">لم يُتخذ أي إجراء بعد.</p>'}
    </section>`;
  }

  function gCampaigns() {
    return `
    ${pageHead('الحملات', 'أداء كل حملة في خدمة حجاجها ذوي محدودية الحركة')}
    <div class="camp-grid">
      ${CAMPAIGNS.map(c => {
        const ps = pilgrimsOf(c.id);
        const high = ps.filter(p => p.risk === 'high').length;
        const open = openReqs(c.id).length;
        const done = state.requests.filter(r => r.status === 'done' && P(r.pid).campaign === c.id).length;
        return `
        <article class="card camp">
          <h2>${esc(c.name)}</h2>
          <p class="muted">المشرف: ${esc(c.supervisor)}<br>${esc(c.camp)}</p>
          <dl class="camp-nums">
            <div><dt>الحجاج</dt><dd>${ps.length}</dd></div>
            <div class="${high ? 'risky' : ''}"><dt>خطر مرتفع</dt><dd>${high}</dd></div>
            <div><dt>طلبات مفتوحة</dt><dd>${open}</dd></div>
            <div><dt>منجزة</dt><dd>${done}</dd></div>
          </dl>
          <button class="btn btn-ghost wide" data-act="reg-filter" data-k="camp" data-v="${c.id}">عرض حجاج الحملة</button>
        </article>`;
      }).join('')}
    </div>`;
  }

  /* ================= مشرف الحملة ================= */

  function cHome() {
    const c = C(state.campaignId);
    const ps = pilgrimsOf(c.id);
    const rc = { high: 0, medium: 0, low: 0 };
    ps.forEach(p => rc[p.risk]++);
    const list = ps.filter(p => !state.cRisk || p.risk === state.cRisk).sort((a, b) => b.score - a.score);
    const needCounts = Object.keys(NEED_CATS).map(k => [k, ps.filter(p => p.needs.some(n => n.cat === k)).length]);

    return `
    ${pageHead(esc(c.name), `المشرف: ${esc(c.supervisor)}، ${esc(c.camp)}`)}

    <section class="stats">
      <div class="stat"><span>حجاج الحملة</span><strong>${ps.length}</strong></div>
      <div class="stat s-risk"><span>خطر سقوط مرتفع</span><strong>${rc.high}</strong></div>
      <div class="stat"><span>يستخدمون كرسياً متحركاً</span><strong>${ps.filter(p => p.device === 'wheelchair').length}</strong></div>
      <div class="stat"><span>طلبات جديدة</span><strong>${state.requests.filter(r => r.status === 'new' && P(r.pid).campaign === c.id).length}</strong></div>
    </section>

    <section class="card">
      <h2>احتياجات الحملة</h2>
      <ul class="need-sum">${needCounts.map(([k, v]) => `<li><strong>${v}</strong><span>${NEED_CATS[k]}</span></li>`).join('')}</ul>
    </section>

    <div class="list-head">
      <h2>الحجاج</h2>
      <div class="seg-ctrl" role="group" aria-label="تصفية حسب الخطر">
        ${[['', 'الكل'], ['high', 'مرتفع'], ['medium', 'متوسط'], ['low', 'منخفض']].map(([v, t]) => `<button data-act="c-risk" data-v="${v}" aria-pressed="${state.cRisk === v}">${t}${v ? `<b>${rc[v]}</b>` : ''}</button>`).join('')}
      </div>
    </div>

    <div class="p-grid">
      ${list.map(p => {
        const open = state.requests.filter(r => r.pid === p.id && r.status !== 'done').length;
        return `
        <button class="card p-card r-edge-${p.risk}" data-act="open-pilgrim" data-v="${p.id}">
          <div class="p-card-top"><div><strong><bdi>${esc(p.name)}</bdi></strong><span class="mono">${p.id}</span></div>${riskTag(p.risk, false)}</div>
          <p class="p-dev">${icon(p.device === 'wheelchair' ? 'wheelchair' : 'volunteer')}${DEVICES[p.device]}، ${p.age} سنة، ${LANGS[p.lang].ar}</p>
          <ul class="dots">${p.diffs.slice(0, 2).map(d => `<li>${d}</li>`).join('')}</ul>
          ${open ? `<span class="p-open">${open} ${open === 1 ? 'طلب مفتوح' : 'طلبات مفتوحة'}</span>` : ''}
        </button>`;
      }).join('')}
    </div>`;
  }

  function cRequests() {
    const c = C(state.campaignId);
    const all = state.requests.filter(r => P(r.pid).campaign === c.id);
    const tabs = [['open', 'المفتوحة', all.filter(r => r.status !== 'done').length], ['done', 'المنجزة', all.filter(r => r.status === 'done').length]];
    const list = all.filter(r => state.reqTab === 'open' ? r.status !== 'done' : r.status === 'done')
      .sort((a, b) => (a.status === 'new' ? 0 : 1) - (b.status === 'new' ? 0 : 1) || (state.reqTab === 'done' ? b.doneAt - a.doneAt : a.at - b.at));

    const card = r => {
      const p = P(r.pid), L = p.lang, T = REQUEST_TYPES[r.type];
      let act;
      if (r.status === 'new') act = `
        <label class="assign"><span>إسناد إلى</span><select id="st-${r.id}">${c.staff.map((s, i) => `<option value="${i}">${esc(s)}</option>`).join('')}</select></label>
        <button class="btn btn-primary" data-act="req-start" data-v="${r.id}">بدء التنفيذ</button>`;
      else if (r.status === 'progress') act = `
        <p class="assigned">${icon('check')}${esc(c.staff[r.staff])} يتابع الطلب</p>
        <button class="btn btn-primary" data-act="req-done" data-v="${r.id}">تم الإنجاز</button>`;
      else act = `<p class="assigned muted">أنجزه ${esc(c.staff[r.staff])} خلال ${Math.max(1, Math.round((r.doneAt - r.at) / 60000))} دقيقة</p>`;
      const canEscalate = r.status !== 'done' && !r.escalated;

      return `
      <li class="card req s-${r.status}">
        <div class="req-top">
          <h3>${T.ar}</h3>
          <span class="state-tag st-${r.status}">${{ new: 'جديد', progress: 'قيد التنفيذ', done: 'منجز' }[r.status]}</span>
          ${timeTag(r.at)}
        </div>
        <p class="req-who"><button class="link" data-act="open-pilgrim" data-v="${p.id}"><bdi>${esc(p.name)}</bdi></button>${riskTag(p.risk, false)}<span class="muted">${DEVICES[p.device]}</span></p>
        ${r.note && L === 'ar' ? `<p class="req-note">«${esc(r.note)}»</p>` : ''}
        ${L !== 'ar' ? `
        <div class="bridge">
          <p class="bridge-tag">${icon('globe')}أرسله الحاج باللغة ${LANGS[L].ar}</p>
          <div class="bridge-orig" dir="${LANGS[L].dir}" lang="${L}"><p>${T[L]}</p>${r.note ? `<p>«${esc(r.note)}»</p>` : ''}</div>
          ${r.noteAr ? `<p class="bridge-ar">«${esc(r.noteAr)}»</p>` : ''}
        </div>` : ''}
        ${r.escalated ? `<p class="escalated">${icon('flag')}رُفع إلى المشرف العام</p>` : ''}
        <div class="req-actions">${act}${canEscalate ? `<button class="btn btn-quiet" data-act="escalate" data-v="${r.id}">رفع للمشرف العام</button>` : ''}</div>
      </li>`;
    };

    return `
    ${pageHead('الطلبات', `طلبات حجاج ${esc(c.name)} من التطبيق، تصل بالعربية مع نصها الأصلي`)}
    <div class="tabs">${tabs.map(([k, t, n]) => `<button data-act="req-tab" data-v="${k}" aria-pressed="${state.reqTab === k}">${t}<b>${n}</b></button>`).join('')}</div>
    ${list.length ? `<ul class="reqs">${list.map(card).join('')}</ul>` : `<p class="empty">${state.reqTab === 'open' ? 'لا توجد طلبات مفتوحة. ستظهر هنا فور إرسالها من الحجاج.' : 'لم يُنجز أي طلب بعد.'}</p>`}`;
  }

  function cServices() {
    const c = C(state.campaignId);
    const ps = pilgrimsOf(c.id);
    const has = (p, t) => p.needs.some(n => n.text.includes(t));
    const used = {
      wheelchair: ps.filter(p => has(p, 'توفير كرسي')).length,
      cane: ps.filter(p => p.device === 'cane').length,
      walker: ps.filter(p => p.device === 'walker').length
    };
    const escortees = ps.filter(p => p.needs.some(n => n.cat === 'escort'));
    const team = c.staff.map((s, i) => [s, escortees.filter((_, j) => j % c.staff.length === i)]);
    const chips = arr => arr.length ? arr.map(p => `<button class="name-chip" data-act="open-pilgrim" data-v="${p.id}"><bdi>${esc(p.name)}</bdi></button>`).join('') : '<span class="muted">لا أحد</span>';

    const DAYS = [
      ['8 ذو الحجة', 'يوم التروية', 'الانتقال إلى منى', [['مركبة مهيأة', p => has(p, 'مركبة')], ['مرافق أثناء الانتقال', p => p.needs.some(n => n.cat === 'escort')]]],
      ['9 ذو الحجة', 'يوم عرفة', 'الانتقال إلى عرفات والوقوف بها', [['مركبة مهيأة', p => has(p, 'مركبة')], ['استراحة مكيفة ومتابعة حرارية', p => p.heat]]],
      ['ليلة 10', 'المبيت بمزدلفة', 'النفرة إلى مزدلفة', [['مركبة مهيأة', p => has(p, 'مركبة')], ['مرافق ليلي', p => p.risk === 'high']]],
      ['10 ذو الحجة', 'يوم النحر', 'رمي جمرة العقبة، والطواف والسعي', [['التوكيل في الرمي', p => has(p, 'التوكيل')], ['مرافق عند الرمي', p => has(p, 'مرافق عند رمي')], ['عربة الطواف والسعي', p => has(p, 'بالعربة')]]],
      ['11 إلى 13', 'أيام التشريق', 'رمي الجمرات الثلاث', [['التوكيل في الرمي', p => has(p, 'التوكيل')], ['مرافق عند الرمي', p => has(p, 'مرافق عند رمي')]]]
    ];

    return `
    ${pageHead('الخدمات والموارد', `تنظيم ما تقدمه ${esc(c.name)} لحجاجها في كل يوم من أيام الحج`)}

    <section>
      <h2 class="sec-title">الأدوات المساعدة</h2>
      <div class="res-grid">
        ${[['wheelchair', 'كراسي متحركة'], ['cane', 'عصي مشي'], ['walker', 'مشايات']].map(([k, t]) => {
          const total = c.stock[k], u = Math.min(used[k], total), left = total - u, short = used[k] > total;
          return `<div class="card res">
            <h3>${t}</h3>
            <p class="res-num"><strong>${left}</strong> متاحة من ${total}</p>
            <div class="meter"><span style="inline-size:${u / total * 100}%"></span></div>
            <p class="muted">${u} مسلّمة للحجاج${short ? `<br><span class="warn">العجز: ${used[k] - total}</span>` : ''}</p>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section>
      <h2 class="sec-title">فريق المرافقة</h2>
      <div class="team">
        ${team.map(([s, arr]) => `<div class="card mate"><h3>${esc(s)}</h3><p class="muted">${arr.length} حجاج يحتاجون مرافقة</p><div class="chips">${chips(arr)}</div></div>`).join('')}
      </div>
    </section>

    <section>
      <h2 class="sec-title">خطة المناسك</h2>
      <ol class="days">
        ${DAYS.map(([d, name, act, rules]) => `
        <li class="card day">
          <div class="day-head"><span class="day-date">${d}</span><div><h3>${name}</h3><p class="muted">${act}</p></div></div>
          <dl class="day-rules">
            ${rules.map(([label, fn]) => { const arr = ps.filter(fn); return `<div><dt>${label}<b>${arr.length}</b></dt><dd class="chips">${chips(arr)}</dd></div>`; }).join('')}
          </dl>
        </li>`).join('')}
      </ol>
    </section>`;
  }

  /* ================= ملف الحاج (موحد) ================= */
  function pilgrimPage() {
    const p = P(state.pilgrimId);
    const c = C(p.campaign);
    const reqs = state.requests.filter(r => r.pid === p.id).sort((a, b) => b.at - a.at);
    const byCat = Object.keys(NEED_CATS).map(k => [k, p.needs.filter(n => n.cat === k)]).filter(x => x[1].length);

    return `
    ${backLink()}
    <header class="profile-head card">
      <div class="ph-main">
        <h1><bdi>${esc(p.name)}</bdi></h1>
        <p class="muted">${p.gender === 'f' ? 'أنثى' : 'ذكر'}، ${p.age} سنة، ${p.nat}، يتحدث ${LANGS[p.lang].ar}</p>
        <dl class="facts row">
          <div><dt>الحملة</dt><dd>${esc(c.name)}</dd></div>
          <div><dt>السكن</dt><dd>${esc(p.tent)}</dd></div>
          <div><dt>الموقع الحالي</dt><dd>${SITES[p.site].ar}${p.pos ? `<small>قبل ${p.updated} د</small>` : '<small>لا يشارك موقعه</small>'}</dd></div>
          <div><dt>المرافق</dt><dd>${p.companion || 'بلا مرافق'}</dd></div>
        </dl>
      </div>
      <div class="idcard">
        ${barcode(p.id)}
        <p class="mono">${p.id}</p>
      </div>
    </header>

    <div class="profile">
      <section class="card risk-card r-bg-${p.risk}">
        <h2>مؤشر خطر السقوط</h2>
        <div class="risk-big"><strong>${RISK[p.risk]}</strong><span>${p.score} من 100</span></div>
        <div class="risk-scale"><span style="inline-size:${p.score}%"></span></div>
        <h3 class="mini">العوامل المؤثرة</h3>
        <ul class="dots">${p.factors.map(f => `<li>${f}</li>`).join('') || '<li>لا عوامل خطر بارزة</li>'}</ul>
      </section>

      <section class="card">
        <h2>الملف الوظيفي</h2>
        <ul class="func">
          ${DOMAINS.map(([k, t]) => `
          <li><span class="f-label">${t}</span>
            <span class="f-scale" aria-label="${LEVELS[p.f[k]]}">${[0, 1, 2, 3].map(i => `<i class="${i <= p.f[k] ? `on l${p.f[k]}` : ''}"></i>`).join('')}</span>
            <span class="f-level l${p.f[k]}">${LEVELS[p.f[k]]}</span></li>`).join('')}
        </ul>
        <p class="hint">الأداة المساعدة: ${DEVICES[p.device]}${p.device !== 'wheelchair' ? `، وأقصى مسافة مشي دون توقف ${p.maxWalk} م تقريباً` : ''}</p>
      </section>

      <section class="card">
        <h2>الصعوبات التي يواجهها</h2>
        <ul class="dots">${p.diffs.map(d => `<li>${d}</li>`).join('')}</ul>
        ${p.conds.length ? `<h3 class="mini">حالات صحية تؤثر على الحركة</h3><p>${p.conds.join('، ')}</p>` : ''}
      </section>

      <section class="card">
        <h2>المساعدة التي يحتاجها</h2>
        <div class="need-groups">
          ${byCat.map(([k, arr]) => `<div><h3 class="mini">${NEED_CATS[k]}</h3><ul class="dots">${arr.map(n => `<li>${n.text}</li>`).join('')}</ul></div>`).join('')}
        </div>
      </section>

      ${p.pos ? `<section class="card"><h2>أقرب الخدمات لموقعه الآن</h2>${nearestBlock(p.pos)}</section>` : ''}

      <section class="card">
        <h2>طلباته</h2>
        ${reqs.length ? `<ul class="mini-reqs">${reqs.map(r => `<li><span>${REQUEST_TYPES[r.type].ar}</span><span class="state-tag st-${r.status}">${{ new: 'جديد', progress: 'قيد التنفيذ', done: 'منجز' }[r.status]}</span>${timeTag(r.at)}</li>`).join('')}</ul>` : '<p class="empty">لا طلبات مسجلة.</p>'}
      </section>
    </div>`;
  }

  /* ================= العرض ================= */
  function view() {
    switch (state.page) {
      case 'overview': return gOverview();
      case 'registry': return gRegistry();
      case 'map': return gMap();
      case 'calls': return gCalls();
      case 'case': return gCase();
      case 'campaigns': return gCampaigns();
      case 'c-home': return cHome();
      case 'c-requests': return cRequests();
      case 'c-services': return cServices();
      case 'pilgrim': return pilgrimPage();
    }
    return '';
  }

  function render(keepScroll) {
    const y = window.scrollY;
    $('#app').innerHTML = sidebar() + `<main class="main" id="main" tabindex="-1">${view()}</main>`;
    if (keepScroll) window.scrollTo(0, y);
    else {
      window.scrollTo(0, 0);
      const cur = document.querySelector('.nav [aria-current="page"]');
      if (cur && window.innerWidth <= 960) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }

  let toastT;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 3800);
  }

  function go(page, back) {
    if (page === 'pilgrim' || page === 'case') state.back = back || (state.page === 'pilgrim' || state.page === 'case' ? state.back : state.page);
    state.page = page;
    render();
    const m = $('#main'); if (m) m.focus({ preventScroll: true });
  }

  function logCall(c, text) {
    c.log.unshift({ at: Date.now(), text });
    if (c.status === 'waiting') c.status = 'active';
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
    const a = el.dataset.act, v = el.dataset.v;
    const call = () => state.calls.find(x => x.id === state.callId);

    if (a === 'role') { state.role = v; state.page = v === 'general' ? 'overview' : 'c-home'; render(); }
    else if (a === 'go') go(v);
    else if (a === 'back') { state.page = state.page === 'case' ? 'calls' : (state.back || (state.role === 'general' ? 'overview' : 'c-home')); render(); }
    else if (a === 'open-pilgrim') { state.pilgrimId = v; go('pilgrim', state.page === 'pilgrim' ? state.back : state.page); }
    else if (a === 'open-call') {
      const c = state.calls.find(x => x.id === v);
      if (c.status === 'waiting') logCall(c, 'تم الرد على الحاج وفتح ملفه');
      state.callId = v; state.back = 'calls'; state.page = 'case'; render();
    }
    else if (a === 'reg-filter') { state.reg = { q: '', risk: '', camp: '', need: '', site: '' }; state.reg[el.dataset.k] = v; state.role = 'general'; go('registry'); }
    else if (a === 'reg-clear') { state.reg = { q: '', risk: '', camp: '', need: '', site: '' }; render(true); }
    else if (a === 'scan') {
      const p = PILGRIMS[Math.floor(Math.random() * PILGRIMS.length)];
      toast(`قُرئ الباركود: ${p.id}`);
      state.pilgrimId = p.id; go('pilgrim', 'registry');
    }
    else if (a === 'layer') { state.layers.has(v) ? state.layers.delete(v) : state.layers.add(v); render(true); }
    else if (a === 'layer-p') { state.showPilgrims = !state.showPilgrims; render(true); }
    else if (a === 'map-sel') { state.mapSel = v; render(true); }
    else if (a === 'send-dir') {
      const c = call(); const s = S(c.dest || document.querySelector('input[name=dest]:checked').value);
      const p = P(c.pid);
      logCall(c, `أُرسل للحاج توجيه إلى ${esc(s.name)} باللغة ${LANGS[p.lang].ar}`);
      render(true); toast('أُرسل التوجيه للحاج بلغته');
    }
    else if (a === 'radio') {
      const c = call(); const s = S(v);
      logCall(c, `بُث البلاغ على اللاسلكي إلى ${esc(s.name)}، القناة ${s.channel}`);
      const p = P(c.pid);
      logCall(c, `أُبلغ الحاج باللغة ${LANGS[p.lang].ar}: «${esc(langText(MSGS.stay, 'ar'))}»`);
      render(true); toast(`سُجّل البث على القناة ${s.channel}`);
    }
    else if (a === 'amb') {
      const c = call(); const s = S(v);
      logCall(c, `طُلب الإسعاف من ${esc(s.name)}، القناة ${s.channel}`);
      logCall(c, `أُبلغ الحاج: «${esc(MSGS.amb.ar)}»`);
      render(true); toast('أُرسل طلب الإسعاف');
    }
    else if (a === 'close-call') {
      const c = call(); c.log.unshift({ at: Date.now(), text: 'أُغلقت الحالة' }); c.status = 'closed';
      render(true); toast('أُغلقت الحالة');
    }
    else if (a === 'c-risk') { state.cRisk = v; render(true); }
    else if (a === 'req-tab') { state.reqTab = v; render(true); }
    else if (a === 'req-start') {
      const r = state.requests.find(x => x.id === v);
      r.staff = +document.getElementById('st-' + v).value; r.status = 'progress';
      render(true); toast(`أُسند الطلب إلى ${C(state.campaignId).staff[r.staff]}، وأُبلغ الحاج بلغته`);
    }
    else if (a === 'req-done') {
      const r = state.requests.find(x => x.id === v);
      r.status = 'done'; r.doneAt = Date.now();
      render(true); toast('سُجّل الطلب منجزاً');
    }
    else if (a === 'escalate') {
      const r = state.requests.find(x => x.id === v);
      r.escalated = true;
      state.calls.push({ id: 'k' + (++state.seq), pid: r.pid, escalated: true, reqType: r.type, at: Date.now(), status: 'waiting', log: [{ at: Date.now(), text: `رُفع من ${esc(C(P(r.pid).campaign).name)}` }] });
      render(true); toast('رُفع الطلب، ويظهر الآن في التواصل الوارد لدى المشرف العام');
    }
  });

  document.addEventListener('change', e => {
    const el = e.target, a = el.dataset.act;
    if (a === 'pick-campaign') { state.campaignId = el.value; state.cRisk = ''; state.page = state.page === 'pilgrim' ? 'c-home' : state.page; render(); }
    else if (a === 'reg-set') { state.reg[el.dataset.k] = el.value; render(true); }
    else if (a === 'dest') { state.calls.find(x => x.id === state.callId).dest = el.value; render(true); }
  });

  let qT;
  document.addEventListener('input', e => {
    if (e.target.id !== 'reg-q') return;
    state.reg.q = e.target.value;
    clearTimeout(qT);
    qT = setTimeout(() => {
      const pos = e.target.selectionStart;
      render(true);
      const inp = $('#reg-q'); inp.focus(); inp.setSelectionRange(pos, pos);
    }, 180);
  });

  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act], g[data-act], circle[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });

  setInterval(() => document.querySelectorAll('time[data-ts]').forEach(t => { t.textContent = ago(+t.dataset.ts); }), 20000);

  render();
})();

</script>
</body>
</html>
