<style>
/* سند — واجهة الحاج (نفس هوية واجهات المشرفين) */
:root {
  color-scheme: light;
  --bg: #E9EDEA; --surface: #FFFFFF; --surface-2: #F4F7F5; --ink: #15302A; --ink-2: #566A63; --line: #DCE3DF;
  --green: #1F4D41; --green-2: #3E6D5E; --green-ink: #FFFFFF; --green-soft: #E2EEE9;
  --gold: #9C7A3C; --gold-soft: #F5EEDF;
  --high: #B42318; --high-soft: #FDE8E5; --med: #B45309; --med-soft: #FDF0DD; --low: #2F7D5B; --low-soft: #E3F2EA;
  --focus: #1A73E8;
  --font: 'Readex Pro', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0B1412; --surface: #15221E; --surface-2: #1C2B27; --ink: #E4EDE9; --ink-2: #9FB2AB; --line: #2A3B36;
    --green: #6CC4A8; --green-2: #8FD3BD; --green-ink: #06201A; --green-soft: #1C3830;
    --gold: #DDB86A; --gold-soft: #2D2617;
    --high: #FF8A7E; --high-soft: #3B1E1B; --med: #F5B064; --med-soft: #3A2A16; --low: #7DD3A8; --low-soft: #183327;
    --focus: #8AB4F8;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, p, dl, dd, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--ink-2); }
bdi { unicode-bidi: isolate; }
.ic { inline-size: 1.2em; block-size: 1.2em; flex: none; }
.ic-lg { inline-size: 1.5rem; block-size: 1.5rem; }
.ic-xl { inline-size: 2rem; block-size: 2rem; }
:lang(ur) { font-family: 'Noto Nastaliq Urdu', var(--font); line-height: 2.1; }

#app { min-block-size: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
.demo { inline-size: 100%; max-inline-size: 440px; font-size: 0.8125rem; color: var(--ink-2); direction: rtl; font-family: var(--font); line-height: 1.6; }
.demo label { display: flex; align-items: center; gap: 8px; }
.demo select { flex: 1; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-block-size: 40px; }

/* ---------- الهاتف ---------- */
.phone {
  position: relative; inline-size: 100%; max-inline-size: 440px; block-size: min(880px, calc(100dvh - 90px));
  background: var(--bg); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column;
  border: 1px solid var(--line); box-shadow: 0 24px 60px rgb(10 30 25 / 0.12);
}
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; background: var(--bg); }
.p-brand { display: flex; align-items: center; gap: 8px; }
.p-brand img { inline-size: 40px; }
.p-brand strong { font-size: 1.4rem; color: var(--green); font-weight: 700; font-family: var(--font); line-height: 1; }
@media (prefers-color-scheme: dark) { .p-brand img, .id-top img, .call-avatar img { background: #F4F3EF; border-radius: 10px; padding: 3px; } }
.p-lang { display: flex; align-items: center; gap: 4px; color: var(--green); }
.p-lang select { min-block-size: 44px; font-size: 0.9375rem; max-inline-size: 10rem; }

.screen { flex: 1; overflow-y: auto; padding: 6px 18px 28px; display: grid; gap: 14px; align-content: start; scroll-behavior: smooth; }
.p-hello { font-size: 1.5rem; font-weight: 600; line-height: 1.35; }
.p-title { font-size: 1.625rem; font-weight: 600; margin-block: 4px 2px; }
.p-h2 { font-size: 1.1875rem; font-weight: 600; margin-block-start: 10px; }
.p-h2-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-block-start: 10px; }
.p-h2-row .p-h2 { margin: 0; }
.p-link { color: var(--green); font-weight: 600; font-size: 0.9375rem; min-block-size: 44px; padding-inline: 4px; }
.p-hint { color: var(--ink-2); font-size: 0.9375rem; margin-block-start: -6px; }
.p-where { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink-2); font-size: 0.9375rem; }
.p-where small { flex-basis: 100%; font-size: 0.8125rem; }

/* بطاقة الهوية: العنصر المميِّز */
.id-card { border-radius: 22px; padding: 18px; background: linear-gradient(150deg, #1F4D41, #2E6253 60%, #3E6D5E); color: #fff; display: grid; gap: 14px; }
.id-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.id-top img { inline-size: 44px; background: #F4F3EF; border-radius: 12px; padding: 4px; }
.id-name { font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.id-camp { font-size: 0.9375rem; opacity: 0.85; }
.id-code { background: #fff; color: #15302A; border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.barcode { display: block; inline-size: 100%; block-size: 58px; fill: #15302A; }
.id-code p { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.8125rem; color: #566A63; }
.id-code b { font-size: 1.125rem; color: #15302A; letter-spacing: 0.04em; }
.id-hint { font-size: 0.8125rem; opacity: 0.85; line-height: 1.5; }
.id-card :lang(ur), .id-card[lang="ur"] { line-height: 2; }

/* أزرار المساعدة */
.help { display: grid; gap: 10px; }
.help-btn { display: flex; align-items: center; gap: 14px; inline-size: 100%; min-block-size: 76px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); }
.help-btn strong { display: block; font-size: 1.0625rem; font-weight: 600; line-height: 1.35; }
.help-btn small { display: block; font-size: 0.875rem; color: var(--ink-2); line-height: 1.4; }
.hb-ic { display: grid; place-items: center; inline-size: 48px; block-size: 48px; border-radius: 14px; background: var(--green-soft); color: var(--green); flex: none; }
.help-btn.primary { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.help-btn.primary small { color: inherit; opacity: 0.85; }
.help-btn.primary .hb-ic { background: rgb(255 255 255 / 0.16); color: inherit; }
.help-btn.sos { border-color: var(--high); background: var(--high-soft); }
.help-btn.sos strong { color: var(--high); }
.help-btn.sos .hb-ic { background: var(--high); color: #fff; }
@media (prefers-color-scheme: dark) { .help-btn.sos .hb-ic { color: #2A0B08; } }
.help-btn:active, .req-btn:active { transform: scale(0.985); }

/* الخدمات */
.svc-list { display: grid; gap: 8px; }
.svc { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.svc > div { flex: 1; min-inline-size: 0; }
.svc strong { display: block; font-weight: 600; font-size: 0.9375rem; line-height: 1.4; }
.svc span { font-size: 0.8125rem; color: var(--ink-2); }
.svc .sv { color: #fff; }
.svc em { font-style: normal; color: var(--med); font-weight: 600; }
.svc b { font-size: 1rem; white-space: nowrap; color: var(--green); }
.t-health { --t: #C0392B; } .t-ambulance { --t: #8E1B12; } .t-volunteer { --t: #9C7A3C; }
.t-wheelchair { --t: #1F4D41; } .t-toilet { --t: #3F6A8A; } .t-rest { --t: #2E8A82; }
.sv { display: grid; place-items: center; inline-size: 40px; block-size: 40px; border-radius: 12px; background: var(--t); color: #fff; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: -18px; padding-inline: 18px; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.875rem; min-block-size: 40px; }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.map-box { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.mini-map { display: block; inline-size: 100%; block-size: auto; background: var(--surface-2); }
.mini-map .reg { fill: var(--green-soft); stroke: color-mix(in srgb, var(--green) 25%, transparent); }
.mini-map .road { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; }
.mini-map .pin rect { fill: var(--t); stroke: var(--surface); stroke-width: 2; }
.mini-map .me circle:first-child { fill: color-mix(in srgb, #1A73E8 22%, transparent); animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.mini-map .me circle:last-child { fill: #1A73E8; stroke: #fff; stroke-width: 2.5; }
@keyframes ping { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

.share { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; position: relative; }
.share > span { flex: 1; }
.share strong { display: block; font-size: 0.9375rem; font-weight: 600; }
.share small { display: block; font-size: 0.8125rem; color: var(--ink-2); }
.share input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.share i { flex: none; inline-size: 50px; block-size: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background 0.2s; }
.share i::after { content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; inline-size: 24px; block-size: 24px; border-radius: 50%; background: #fff; transition: inset-inline-start 0.2s; box-shadow: 0 1px 3px rgb(0 0 0 / 0.2); }
.share input:checked + i { background: var(--green); }
.share input:checked + i::after { inset-inline-start: 23px; }
.share input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ملفي */
.p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 12px; }
.p-card h2 { font-size: 1.0625rem; font-weight: 600; }
.p-facts { display: grid; }
.p-facts div { display: flex; justify-content: space-between; gap: 12px; padding-block: 10px; border-block-start: 1px solid var(--line); }
.p-facts div:first-child { border: 0; padding-block-start: 0; }
.p-facts dt { color: var(--ink-2); font-size: 0.9375rem; }
.p-facts dd { font-weight: 500; text-align: end; }
.risk.r-high { border-color: var(--high); background: var(--high-soft); }
.risk.r-medium { border-color: var(--med); background: var(--med-soft); }
.risk.r-low { border-color: var(--low); background: var(--low-soft); }
.risk-level { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.r-high .risk-level { color: var(--high); } .r-medium .risk-level { color: var(--med); } .r-low .risk-level { color: var(--low); }
.risk-tip { font-size: 0.9375rem; }
.func { display: grid; }
.func li { display: grid; gap: 4px; padding-block: 10px; border-block-start: 1px solid var(--line); font-size: 0.9375rem; }
.func li:first-child { border: 0; padding-block-start: 0; }
.f-row { display: flex; align-items: center; gap: 10px; }
.f-scale { display: flex; gap: 3px; }
.f-scale i { inline-size: 22px; block-size: 8px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.f-scale i.on.l0 { background: var(--low); border-color: var(--low); }
.f-scale i.on.l1 { background: var(--green-2); border-color: var(--green-2); }
.f-scale i.on.l2 { background: var(--med); border-color: var(--med); }
.f-scale i.on.l3 { background: var(--high); border-color: var(--high); }
.f-row em { font-style: normal; font-size: 0.8125rem; color: var(--ink-2); }
.f-row em.l2 { color: var(--med); font-weight: 600; } .f-row em.l3 { color: var(--high); font-weight: 600; }
.needs { display: grid; gap: 8px; }
.needs li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9375rem; }
.needs .ic { color: var(--green); margin-block-start: 0.25em; }

/* حملتي */
.camp-name { font-size: 1.25rem; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-block-size: 50px; padding: 10px 18px; border-radius: 14px; font-weight: 600; border: 1.5px solid transparent; }
.btn-primary { background: var(--green); color: var(--green-ink); }
.btn-ghost { border-color: var(--line); background: var(--surface); }
.btn.wide { inline-size: 100%; }
.req-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.req-btn { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 12px; min-block-size: 112px; padding: 14px; border-radius: 18px; background: var(--green-soft); border: 2px solid transparent; font-weight: 500; line-height: 1.35; }
.req-btn .ic { color: var(--green); }
.req-btn:hover { border-color: var(--green); }
.mine { display: grid; gap: 8px; }
.mine li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.mine li > .ic { color: var(--ink-2); }
.mine-type { font-weight: 500; }
.mine-st { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--ink-2); }
.dot { inline-size: 9px; block-size: 9px; border-radius: 50%; background: var(--ink-2); flex: none; }
.st-new .dot { background: var(--gold); animation: pulse 1.6s ease-in-out infinite; }
.st-progress .dot { background: var(--green); }
.st-progress .mine-st { color: var(--green); font-weight: 500; }
.st-done { opacity: 0.7; }
time { font-size: 0.8125rem; color: var(--ink-2); white-space: nowrap; }
.empty { color: var(--ink-2); padding: 18px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* شريط التبويب */
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-block-start: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
.tabbar button { position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--ink-2); font-size: 0.75rem; min-block-size: 56px; line-height: 1.3; text-align: center; }
.tabbar [aria-current="page"] { color: var(--green); font-weight: 600; }
.tabbar [aria-current="page"] .ic { background: var(--green-soft); border-radius: 999px; padding: 3px 14px; box-sizing: content-box; }
.tb-dot { position: absolute; inset-block-start: 6px; inset-inline-end: 28%; inline-size: 8px; block-size: 8px; border-radius: 50%; background: var(--green); }

/* النوافذ */
.backdrop { position: absolute; inset: 0; background: rgb(8 20 16 / 0.45); z-index: 20; }
.sheet { position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 21; background: var(--surface); border-radius: 26px 26px 0 0; padding: 22px 20px 26px; display: grid; gap: 16px; max-block-size: 88%; overflow-y: auto; animation: rise 0.22s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }
.sheet h2 { display: flex; align-items: center; gap: 10px; font-size: 1.375rem; font-weight: 600; color: var(--green); }
.note { display: grid; gap: 6px; font-weight: 600; }
textarea { font-weight: 400; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); resize: vertical; }
.sheet-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.topics { display: grid; gap: 8px; }
.topic { padding: 14px 16px; min-block-size: 56px; border-radius: 14px; border: 1.5px solid var(--line); font-weight: 500; }
.topic:hover { border-color: var(--green); }
.topic.urgent { border-color: color-mix(in srgb, var(--high) 50%, var(--line)); color: var(--high); }

/* شاشة المكالمة */
.call { position: absolute; inset: 0; z-index: 30; background: linear-gradient(170deg, #173E34, #1F4D41 45%, #2E6253); color: #fff; display: grid; grid-template-rows: 1fr auto auto; padding: 48px 24px 40px; gap: 24px; animation: fade 0.2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.call-who { display: grid; justify-items: center; align-content: center; gap: 10px; text-align: center; }
.call-avatar { inline-size: 104px; block-size: 104px; border-radius: 50%; background: #F4F3EF; display: grid; place-items: center; position: relative; }
.call-avatar img { inline-size: 70px; }
.call-avatar.ringing::before, .call-avatar.ringing::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.35); animation: ring 1.8s ease-out infinite; }
.call-avatar.ringing::after { animation-delay: 0.9s; }
@keyframes ring { from { transform: scale(0.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.call-name { font-size: 1.375rem; font-weight: 600; margin-block-start: 10px; }
.call-state { opacity: 0.85; }
.call-topic { margin-block-start: 6px; padding: 6px 14px; border-radius: 999px; background: rgb(255 255 255 / 0.14); font-size: 0.9375rem; }
.call-info { display: grid; gap: 8px; }
.call-info li { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgb(255 255 255 / 0.1); font-size: 0.9375rem; }
.call-ctrls { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; }
.call-ctrls button { display: grid; justify-items: center; gap: 8px; font-size: 0.8125rem; color: #fff; }
.call-ctrls button .ic { inline-size: 28px; block-size: 28px; padding: 18px; box-sizing: content-box; border-radius: 50%; background: rgb(255 255 255 / 0.14); }
.call-ctrls [aria-pressed="true"] .ic { background: #fff; color: #1F4D41; }
.call-ctrls .end .ic { background: #D93025; transform: rotate(135deg); }

#toast { position: absolute; inset-inline: 16px; inset-block-end: 92px; z-index: 40; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 500; text-align: center; transform: translateY(20px); opacity: 0; visibility: hidden; transition: 0.25s; }
#toast.show { transform: none; opacity: 1; visibility: visible; }

@media (max-width: 480px) {
  #app { padding: 0; gap: 0; }
  .demo { padding: 8px 12px; background: var(--surface); border-block-end: 1px solid var(--line); max-inline-size: none; }
  .phone { max-inline-size: none; border-radius: 0; border: 0; box-shadow: none; block-size: calc(100dvh - 57px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>

/* ---------- توليد الحجاج (ثابت في كل تحميل) ---------- */
function makeRng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildPilgrims() {
  const rnd = makeRng(1447);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const range = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const deviceCycle = ['wheelchair', 'cane', 'wheelchair', 'walker', 'none', 'cane', 'wheelchair', 'none'];

  return PEOPLE.map(([name, gender, lang, nat], i) => {
    const device = deviceCycle[i % deviceCycle.length];
    const campaign = CAMPAIGNS[i % CAMPAIGNS.length].id;
    const age = range(58, 86);
    const f = {};
    if (device === 'wheelchair') Object.assign(f, { walk: 3, stand: range(2, 3), slope: 3, transfer: range(1, 2), crowd: range(2, 3), selfcare: range(1, 2) });
    else if (device === 'walker') Object.assign(f, { walk: range(2, 3), stand: 2, slope: range(2, 3), transfer: range(0, 1), crowd: 2, selfcare: range(0, 1) });
    else if (device === 'cane') Object.assign(f, { walk: 2, stand: range(1, 2), slope: 2, transfer: range(0, 1), crowd: range(1, 2), selfcare: range(0, 1) });
    else Object.assign(f, { walk: range(1, 2), stand: 1, slope: range(1, 2), transfer: 0, crowd: range(0, 1), selfcare: 0 });

    const maxWalk = device === 'wheelchair' ? range(0, 2) * 10 : device === 'walker' ? range(5, 15) * 10 : device === 'cane' ? range(10, 30) * 10 : range(25, 60) * 10;
    const falls = rnd() < 0.45 ? range(1, 3) : 0;
    const conds = [];
    const nCond = range(0, 2);
    while (conds.length < nCond) { const c = pick(CONDITIONS); if (!conds.includes(c)) conds.push(c); }
    const vision = conds.includes('ضعف النظر') || rnd() < 0.2;
    const meds = rnd() < 0.35;
    const heat = conds.includes('السكري') || conds.includes('أمراض القلب') || age >= 78;

    const g = (m, w) => gender === 'f' ? w : m;
    const factors = [];
    let score = 0;
    if (falls) { score += falls > 1 ? 30 : 20; factors.push(falls > 1 ? `${g('سقط', 'سقطت')} ${falls === 2 ? 'مرتين' : falls + ' مرات'} خلال السنة الماضية` : `${g('سقط', 'سقطت')} مرة خلال السنة الماضية`); }
    if (f.crowd >= 2) { score += 15; factors.push('ضعف التوازن وسط الزحام'); }
    if (device === 'cane' || device === 'walker') { score += 15; factors.push(`${g('يعتمد', 'تعتمد')} على ${DEVICES[device]} في المشي`); }
    if (device === 'wheelchair') { score += 10; factors.push('خطر السقوط أثناء الانتقال من الكرسي وإليه'); }
    if (vision) { score += 10; factors.push('ضعف في النظر أو نوبات دوار'); }
    if (meds) { score += 10; factors.push(`${g('يتناول', 'تتناول')} أدوية قد تسبب الدوار أو النعاس`); }
    if (age >= 75) { score += 10; factors.push('العمر 75 سنة أو أكثر'); }
    if (maxWalk < 200 && device !== 'wheelchair') { score += 5; factors.push('قدرة تحمل منخفضة في المشي'); }
    score = Math.min(100, score);
    const risk = score >= 55 ? 'high' : score >= 30 ? 'medium' : 'low';

    const needs = [];
    if (device === 'wheelchair') needs.push({ cat: 'devices', text: rnd() < 0.5 ? 'كرسي متحرك (يملك كرسيه)' : 'توفير كرسي متحرك من الحملة' });
    if (device === 'cane') needs.push({ cat: 'devices', text: 'عصا مشي' });
    if (device === 'walker') needs.push({ cat: 'devices', text: 'مشاية' });
    if (risk === 'high' || f.selfcare >= 2) needs.push({ cat: 'escort', text: 'مرافق دائم' });
    else if (f.crowd >= 2) needs.push({ cat: 'escort', text: 'مرافق في أماكن الزحام' });
    if (f.walk >= 2) needs.push({ cat: 'mobility', text: 'مركبة مهيأة للتنقل بين المشاعر' });
    if (f.walk >= 2) needs.push({ cat: 'rituals', text: 'الطواف والسعي بالعربة' });
    if (f.walk >= 3 || (risk === 'high' && f.crowd >= 2)) needs.push({ cat: 'rituals', text: 'التوكيل في رمي الجمرات' });
    else if (f.crowd >= 1) needs.push({ cat: 'rituals', text: 'مرافق عند رمي الجمرات' });
    if (conds.includes('السكري')) needs.push({ cat: 'health', text: 'متابعة السكر ومواعيد الدواء' });
    if (heat) needs.push({ cat: 'health', text: 'استراحات مظللة متقاربة لتجنب الإجهاد الحراري' });
    if (f.selfcare >= 1) needs.push({ cat: 'health', text: 'دورة مياه مهيأة قريبة من مكان الإقامة' });

    const diffs = [];
    if (device === 'wheelchair') diffs.push(g('لا يمشي، ويتنقل بالكرسي المتحرك', 'لا تمشي، وتتنقل بالكرسي المتحرك'));
    else diffs.push(`أقصى مسافة مشي دون توقف: ${maxWalk} م تقريباً`);
    if (f.stand >= 2) diffs.push(g('لا يتحمل', 'لا تتحمل') + ' الوقوف أكثر من 10 دقائق');
    if (f.slope >= 2) diffs.push('صعوبة في المنحدرات، مثل جسر الجمرات');
    if (f.transfer >= 1) diffs.push(f.transfer >= 2 ? g('يحتاج شخصاً لمساعدته', 'تحتاج شخصاً لمساعدتها') + ' في الانتقال من الكرسي وإليه' : g('يحتاج', 'تحتاج') + ' إشرافاً عند الانتقال من الكرسي وإليه');
    if (f.crowd >= 2) diffs.push(g('يفقد توازنه', 'تفقد توازنها') + ' بسهولة وسط الزحام');
    if (f.selfcare >= 2) diffs.push(g('يحتاج', 'تحتاج') + ' مساعدة في استخدام دورة المياه');
    if (heat) diffs.push('حساسية عالية للحرارة');

    const site = rnd() < 0.62 ? 'arafat' : rnd() < 0.7 ? 'mina' : 'haram';
    const [bx, by, bw, bh] = SITES[site].box;
    const located = rnd() < 0.82;
    const pos = located ? { x: Math.round(bx + 15 + rnd() * (bw - 30)), y: Math.round(by + 15 + rnd() * (bh - 30)) } : null;
    const companion = needs.some(n => n.cat === 'escort') && rnd() < 0.65 ? pick(gender === 'f' ? ['ابنها', 'ابنتها', 'زوجها', 'أختها'] : ['ابنه', 'ابنته', 'زوجته', 'أخوه']) : null;

    return {
      id: 'SND-' + String(104200 + i * 37 + range(1, 30)),
      name, gender, lang, nat, age, campaign, device, f, maxWalk, falls, conds, meds, vision, heat,
      score, risk, factors, needs, diffs, site, pos, companion,
      updated: range(1, 25),
      tent: CAMPAIGNS.find(c => c.id === campaign).camp
    };
  });
}

  const state = {

    lang: DEMO[0].lang,
    tab: 'home',
    sheet: null,
    topicSheet: null,
    call: null,
    filter: 'all',
    requests: buildRequests(NOW),
    shareOff: {},
    seq: 200

  /* ---------- أدوات ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const L = () => state.lang;
  const tr = (obj, l = L()) => (obj && (obj[l] || obj.ar)) || '';
  const t = (k, v = {}) => tr(PS[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
  const me = () => PILGRIMS.find(p => p.id === state.pid);
  const camp = () => CAMPAIGNS.find(c => c.id === me().campaign);
  const latinOk = () => !['ar', 'ur'].includes(L());
  const nameL = s => latinOk() ? (LATIN[s] || s) : s;
  const sharing = () => !!me().pos && !state.shareOff[state.pid];
  const myPos = () => sharing() ? me().pos : { x: SITES[me().site].box[0] + SITES[me().site].box[2] / 2, y: SITES[me().site].box[1] + SITES[me().site].box[3] / 2 };
  const meters = (a, b) => Math.round(Math.hypot(a.x - b.x, a.y - b.y) * 25 / 10) * 10;
  const dist = m => m >= 1000 ? t('km', { n: (m / 1000).toFixed(1) }) : t('m', { n: m });
  const mins = ts => Math.max(0, Math.floor((Date.now() - ts) / 60000));
  const ago = ts => mins(ts) < 1 ? t('justNow') : t('minAgo', { n: mins(ts) });
  const svcName = s => {
    if (L() === 'ar') return s.name;
    const num = (s.name.match(/\d+/) || [''])[0];
    return `${tr(SVC_L[s.type])}, ${tr(SITE_L[s.site])}${num ? ' ' + num : ''}`.replace(', ', L() === 'ur' ? '، ' : ', ');
  };
  const near = (type) => SERVICES.filter(s => type === 'all' || s.type === type)
    .map(s => ({ s, d: meters(myPos(), s) })).sort((a, b) => a.d - b.d);
  const nearestOf = type => near(type)[0];

  const IC = {

  const icon = (n, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
  const REQ_ICON = { wheelchair: 'wheelchair', cane: 'cane', companion: 'companion', mobility: 'mobility', transport: 'transport', medical: 'medical', rest: 'rest', inquiry: 'inquiry' };

  function barcode(id) {
    let x = 0, bars = '';
    const digits = id.replace(/\D/g, '') + '7';
    const push = (w, dark) => { if (dark) bars += `<rect x="${x}" y="0" width="${w}" height="34"/>`; x += w; };
    push(2, 1); push(1, 0); push(1, 1); push(1, 0);
    for (const ch of digits) {
      const n = +ch;
      push(1 + (n % 3), 1); push(1 + ((n + 1) % 2), 0); push(1 + ((n + 2) % 3 === 0 ? 2 : 0), 1); push(1 + (n % 2), 0);
    }
    push(1, 1); push(1, 0); push(2, 1);
    return `<svg class="barcode" viewBox="0 0 ${x} 34" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
  }

  /* خريطة مصغّرة حول الحاج */
  const T = p => ({ x: p.x, y: Math.round(p.y + (p.x - 60) * 0.32) });

      <path class="road" d="M150 300C200 290 230 292 260 290S420 300 470 305 560 330 600 330 690 318 730 320"/></g>`;
    const pins = list.map(({ s }) => { const q = T(s); return `<g class="pin t-${s.type}" transform="translate(${q.x - 9} ${q.y - 9})"><rect width="18" height="18" rx="5"/><g transform="translate(2.5 2.5) scale(0.54)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${IC[s.type]}</g></g>`; }).join('');

      <g class="me"><circle cx="${c.x}" cy="${c.y}" r="13"/><circle cx="${c.x}" cy="${c.y}" r="6"/></g>

  }

  function serviceRow({ s, d }) {
    return `<li class="svc">
      <span class="sv t-${s.type}">${icon(s.type)}</span>
      <div><strong>${esc(svcName(s))}</strong><span>${[L() === 'ar' ? tr(SVC_L[s.type]) : '', s.status !== 'متاح' ? `<em>${t('busy')}</em>` : s.hours === 'على مدار الساعة' ? t('open24') : ''].filter(Boolean).join(' · ')}</span></div>
      <b>${dist(d)}</b>
    </li>`;
  }

  function home() {
    const p = me();
    return `
    <h1 class="p-hello">${esc(t('hello', { name: p.name.split(' ')[0] }))}</h1>
    ${idCard()}

    <h2 class="p-h2">${t('needHelp')}</h2>
    <div class="help">
      <button class="help-btn primary" data-act="call-center">
        <span class="hb-ic">${icon('phone', 'ic ic-lg')}</span>
        <span><strong>${t('callCenter')}</strong><small>${t('callCenterSub')}</small></span>
      </button>
      <button class="help-btn" data-act="tab" data-v="campaign">
        <span class="hb-ic">${icon('chat', 'ic ic-lg')}</span>
        <span><strong>${t('contactCampaign')}</strong><small>${t('contactCampaignSub')}</small></span>
      </button>
      <a class="help-btn sos" href="tel:997">
        <span class="hb-ic">${icon('sos', 'ic ic-lg')}</span>
        <span><strong>${t('emergency')}</strong><small>${t('emergencySub')}</small></span>
      </a>
    </div>

    <div class="p-h2-row"><h2 class="p-h2">${t('nearest')}</h2><button class="p-link" data-act="tab" data-v="services">${t('seeAll')}</button></div>
    <p class="p-where">${icon('pin')}${t('youAreAt', { site: tr(SITE_L[p.site]) })}</p>
    <ul class="svc-list">${['health', 'volunteer', 'toilet'].map(k => serviceRow(nearestOf(k))).join('')}</ul>

    ${p.pos ? `
    <label class="share">
      <span><strong>${t('shareLoc')}</strong><small>${sharing() ? t('shareOn') : t('shareOff')}</small></span>
      <input type="checkbox" role="switch" data-act="share" ${sharing() ? 'checked' : ''}><i aria-hidden="true"></i>
    </label>` : ''}`;
  }

  function profile() {
    const p = me(), c = camp();
    const campNum = (p.tent.match(/مخيم\s*([\d/]+)/) || [])[1] || '';
    const comma = ['ar', 'ur'].includes(L()) ? '، ' : ', ';
    const nat = L() === 'ar' ? p.nat : tr(NAT_L[p.nat]);
    const compKey = p.companion && COMP_KEY[p.companion];
    const needs = p.needs.map(n => NEED_KEY[n.text]).filter(Boolean);
    return `
    <h1 class="p-title">${t('tab_profile')}</h1>
    <section class="p-card">
      <h2>${t('myDetails')}</h2>
      <dl class="p-facts">
        <div><dt>${t('idLabel')}</dt><dd class="mono">${p.id}</dd></div>
        <div><dt>${t('campaign')}</dt><dd><bdi>${esc(nameL(c.name))}</bdi></dd></div>
        <div><dt>${t('age')}</dt><dd>${t('years', { n: p.age })}</dd></div>
        <div><dt>${t('nationality')}</dt><dd>${esc(nat)}</dd></div>
        <div><dt>${t('residence')}</dt><dd>${tr(SITE_L.mina)}${comma}${t('campWord')} <span class="mono">${campNum}</span></dd></div>
        <div><dt>${t('companion')}</dt><dd>${compKey ? tr(COMP_L[compKey]) : t('noCompanion')}</dd></div>
        <div><dt>${t('device')}</dt><dd>${tr(DEVICE_L[p.device])}</dd></div>
      </dl>
    </section>

    <section class="p-card risk r-${p.risk}">
      <h2>${t('riskTitle')}</h2>
      <p class="risk-level">${t('risk_' + p.risk)}</p>
      <p class="risk-tip">${t('tip_' + p.risk)}</p>
    </section>

    <section class="p-card">
      <h2>${t('funcTitle')}</h2>
      <p class="p-hint">${t('funcHint')}</p>
      <ul class="func">
        ${DOMAINS.map(([k]) => `
        <li><span>${t('d_' + k)}</span>
          <span class="f-row"><span class="f-scale">${[0, 1, 2, 3].map(i => `<i class="${i <= p.f[k] ? 'on l' + p.f[k] : ''}"></i>`).join('')}</span><em class="l${p.f[k]}">${t('l' + p.f[k])}</em></span>
        </li>`).join('')}
      </ul>
    </section>

    <section class="p-card">
      <h2>${t('myNeeds')}</h2>
      <ul class="needs">${needs.map(k => `<li>${icon('check')}<span>${tr(NEED_L[k])}</span></li>`).join('')}</ul>
    </section>`;
  }

  function campaignTab() {
    const p = me(), c = camp();
    const mine = state.requests.filter(r => r.pid === p.id).sort((a, b) => b.at - a.at);
    const status = r => r.status === 'progress' ? t('st_progress', { staff: `<bdi>${esc(nameL(c.staff[r.staff]))}</bdi>` }) : t('st_' + r.status);
    return `
    <h1 class="p-title">${t('tab_campaign')}</h1>
    <section class="p-card camp-card">
      <p class="camp-name"><bdi>${esc(nameL(c.name))}</bdi></p>
      <p class="muted">${t('supervisor')}: <bdi>${esc(nameL(c.supervisor))}</bdi></p>
      <button class="btn btn-ghost wide" data-act="call-camp">${icon('phone')}${t('callCampaign')}</button>
    </section>

    <h2 class="p-h2">${t('newRequest')}</h2>
    <p class="p-hint">${t('newRequestHint')}</p>
    <div class="req-grid">
      ${Object.keys(REQUEST_TYPES).map(k => `<button class="req-btn" data-act="sheet" data-v="${k}">${icon(REQ_ICON[k], 'ic ic-xl')}<span>${tr(REQUEST_TYPES[k])}</span></button>`).join('')}
    </div>

    <h2 class="p-h2">${t('myRequests')}</h2>
    ${mine.length ? `<ul class="mine">${mine.map(r => `
      <li class="st-${r.status}">
        ${icon(REQ_ICON[r.type], 'ic ic-lg')}
        <div><p class="mine-type">${tr(REQUEST_TYPES[r.type])}</p><p class="mine-st"><span class="dot"></span>${status(r)}</p></div>
        <time data-ts="${r.at}">${ago(r.at)}</time>
      </li>`).join('')}</ul>` : `<p class="empty">${t('empty')}</p>`}`;
  }

  function services() {
    const types = ['all', ...Object.keys(SVC_L)];
    const list = near(state.filter).slice(0, state.filter === 'all' ? 8 : 4);
    return `
    <h1 class="p-title">${t('servicesTitle')}</h1>
    <p class="p-where">${icon('pin')}${t('youAreAt', { site: tr(SITE_L[me().site]) })}${sharing() ? '' : `<small>${t('shareOff')}</small>`}</p>
    <div class="chips" role="group">
      ${types.map(k => `<button class="chip ${k !== 'all' ? 't-' + k : ''}" data-act="filter" data-v="${k}" aria-pressed="${state.filter === k}">${k === 'all' ? t('all') : tr(SVC_L[k])}</button>`).join('')}
    </div>
    <div class="map-box">${miniMap(list)}</div>
    <ul class="svc-list">${list.map(serviceRow).join('')}</ul>`;
  }

  function sheet() {
    const k = state.sheet;
    return `
    <div class="backdrop" data-act="close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <h2 id="sh-t">${icon(REQ_ICON[k], 'ic ic-lg')}${tr(REQUEST_TYPES[k])}</h2>
      <label class="note">${t('note')}<textarea id="note" rows="3" placeholder="${esc(t('notePh'))}"></textarea></label>
      <div class="sheet-actions">
        <button class="btn btn-primary" data-act="send">${t('send')}</button>
        <button class="btn btn-ghost" data-act="close">${t('cancel')}</button>
      </div>
    </div>`;
  }

  function topicSheet() {
    const keys = [...Object.keys(CALL_TOPICS), 'other'];
    return `
    <div class="backdrop" data-act="close"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tp-t">
      <h2 id="tp-t">${t('callWhy')}</h2>
      <div class="topics">
        ${keys.map(k => `<button class="topic ${k !== 'other' && CALL_TOPICS[k].urgent ? 'urgent' : ''}" data-act="start-call" data-v="${k}">${k === 'other' ? t('other') : tr(CALL_TOPICS[k])}</button>`).join('')}
      </div>
      <button class="btn btn-ghost wide" data-act="close">${t('cancel')}</button>
    </div>`;
  }

  function callScreen() {
    const c = state.call, cp = camp();
    const who = c.target === 'center' ? t('centerName') : nameL(cp.supervisor);
    const on = c.phase === 'on';
    const secs = on ? Math.floor((Date.now() - c.since) / 1000) : 0;
    const clock = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    return `
    <div class="call" role="dialog" aria-modal="true" aria-label="${esc(who)}">
      <div class="call-who">
        <div class="call-avatar ${on ? '' : 'ringing'}"><img src="${LOGO_MARK}" alt=""></div>
        <p class="call-name"><bdi>${esc(who)}</bdi></p>
        <p class="call-state" aria-live="polite">${on ? `${t('connected')} <span class="mono" id="clock">${clock}</span>` : t('calling')}</p>
        ${c.topic ? `<p class="call-topic">${c.topic === 'other' ? t('other') : esc(tr(CALL_TOPICS[c.topic]))}</p>` : ''}
      </div>
      ${on && c.target === 'center' ? `<ul class="call-info"><li>${icon('user')}${t('sharedInfo')}</li><li>${icon('globe')}${t('interp')}</li></ul>` : '<div></div>'}
      <div class="call-ctrls">
        <button data-act="toggle" data-v="mute" aria-pressed="${!!c.mute}">${icon('mic', 'ic ic-lg')}<span>${t('mute')}</span></button>
        <button class="end" data-act="end-call">${icon('phone', 'ic ic-lg')}<span>${t('end')}</span></button>
        <button data-act="toggle" data-v="spk" aria-pressed="${!!c.spk}">${icon('speaker', 'ic ic-lg')}<span>${t('speaker')}</span></button>
      </div>
    </div>`;
  }

  function tabbar() {
    const tabs = [['home', 'home'], ['profile', 'user'], ['campaign', 'flag'], ['services', 'map']];
    const newCount = state.requests.filter(r => r.pid === state.pid && r.status === 'progress').length;
    return `<nav class="tabbar" aria-label="tabs">${tabs.map(([k, ic]) => `
      <button data-act="tab" data-v="${k}" aria-current="${state.tab === k ? 'page' : 'false'}">${icon(ic, 'ic ic-lg')}<span>${t('tab_' + k)}</span>${k === 'campaign' && newCount ? '<i class="tb-dot"></i>' : ''}</button>`).join('')}</nav>`;
  }

  function render(keep) {
    const y = $('.screen') ? $('.screen').scrollTop : 0;
    const dir = LANGS[L()].dir;
    const body = { home, profile, campaign: campaignTab, services }[state.tab]();
    $('#app').innerHTML = `
      <div class="demo">
        <label>تجربة بصفة الحاج
          <select data-act="pick">${DEMO.map(p => `<option value="${p.id}" ${p.id === state.pid ? 'selected' : ''}>${esc(p.name)} (${LANGS[p.lang].ar})</option>`).join('')}</select>
        </label>
      </div>
      <div class="phone" dir="${dir}" lang="${L()}">
        ${header()}
        <main class="screen" id="screen">${body}</main>
        ${tabbar()}
        ${state.sheet ? sheet() : ''}
        ${state.topicSheet ? topicSheet() : ''}
        ${state.call ? callScreen() : ''}
        <div id="toast" role="status" aria-live="polite"></div>
      </div>`;
    document.documentElement.lang = L();
    if (keep) $('.screen').scrollTop = y;
    const f = document.querySelector('.sheet textarea, .sheet .topic, .call .end');
    if (f) f.focus({ preventScroll: true });
  }

  let toastT;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200);
  }

  let callTimer;
  function startCall(target, topic) {
    state.topicSheet = null;
    state.call = { target, topic, phase: 'ringing' };
    render(true);
    clearTimeout(callTimer);
    callTimer = setTimeout(() => {
      if (!state.call) return;
      state.call.phase = 'on'; state.call.since = Date.now(); render(true);
    }, 2200);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
    const a = el.dataset.act, v = el.dataset.v;
    if (a === 'tab') { state.tab = v; render(); $('.screen').scrollTop = 0; }
    else if (a === 'sheet') { state.sheet = v; render(true); }
    else if (a === 'close') { state.sheet = null; state.topicSheet = null; render(true); }
    else if (a === 'send') {
      const note = ($('#note') || {}).value?.trim() || '';
      state.requests.push({ id: 'n' + (++state.seq), pid: state.pid, type: state.sheet, note, status: 'new', at: Date.now() });
      state.sheet = null; render(true); toast(t('sent'));
    }
    else if (a === 'filter') { state.filter = v; render(true); }
    else if (a === 'call-center') { state.topicSheet = true; render(true); }
    else if (a === 'start-call') startCall('center', v);
    else if (a === 'call-camp') startCall('campaign', null);
    else if (a === 'toggle') { state.call[v] = !state.call[v]; render(true); }
    else if (a === 'end-call') { clearTimeout(callTimer); state.call = null; render(true); toast(t('callEnded')); }
  });

  document.addEventListener('change', e => {
    const a = e.target.dataset.act;
    if (a === 'lang') { state.lang = e.target.value; render(true); }
    else if (a === 'pick') { state.pid = e.target.value; state.lang = me().lang; state.tab = 'home'; state.filter = 'all'; render(); }
    else if (a === 'share') { state.shareOff[state.pid] = !e.target.checked; render(true); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (state.sheet || state.topicSheet)) { state.sheet = null; state.topicSheet = null; render(true); }
  });

  setInterval(() => {
    const c = $('#clock');
    if (c && state.call && state.call.since) {
      const s = Math.floor((Date.now() - state.call.since) / 1000);
      c.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
    document.querySelectorAll('time[data-ts]').forEach(el => { el.textContent = ago(+el.dataset.ts); });
  }, 1000);

  render();
})();

</script>
</body>
</html>
